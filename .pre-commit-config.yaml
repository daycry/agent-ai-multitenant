# Pre-commit hook configuration for the agentic platform monorepo.
# Run locally: `pre-commit install && pre-commit run --all-files`
# CI runs the same hooks in lint job; both must agree.
#
# Hooks run under whatever python pre-commit finds (typically the venv's
# interpreter). The *output* of black/ruff is pinned to py312 via
# pyproject.toml (target-version), so it's fine if the interpreter is
# newer (3.12, 3.13, etc.).

repos:
  # -------------------- generic / hygiene --------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe so docker-compose's custom tags (!reset, !override)
        # don't trip the PyYAML loader.
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Los manuales de usuario en PDF (docs/manuals/pdf/) son ENTREGABLES
        # versionados a propósito y pueden superar 1 MB (llevan pantallazos
        # embebidos). El runner los regenera; se excluyen de este límite.
        exclude: ^docs/manuals/pdf/.*\.pdf$
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
        # Windows-native scripts must keep CRLF (see .gitattributes).
        # mixed-line-ending doesn't honour .gitattributes, so we
        # exclude them explicitly here.
        exclude: \.(ps1|cmd|bat)$

  # -------------------- Python --------------------
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        # The generated Python SDK (Plan 13 task_13_13) follows the
        # generator's own style. `tool.black.extend-exclude` in pyproject is
        # IGNORED for files pre-commit passes explicitly (only force-exclude
        # applies to those), so exclude the generated dir at the hook level.
        exclude: ^packages/sdk-python/src/agentic_platform_sdk/.*$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy-total (2026-07-08): el gate corre con el ENTORNO DEL PROYECTO — el
  # venv local o el python de CI (el job lint-python instala TODO el workspace
  # editable) — en vez del venv aislado de mirrors-mypy que no veía los
  # paquetes hermanos y forzaba a excluir por path justo el código más crítico
  # (execution/tasks/dispatch/maintenance/cortex_*). El wrapper
  # scripts/mypy_gate.py elige el intérprete; chequea SIEMPRE el árbol
  # completo (apps + packages + agent-runtime) con el caché incremental de
  # mypy. Los únicos excludes que quedan viven en pyproject.toml (migraciones
  # y SDK generado). Gotcha: docs/03-guides/gotchas/mypy-local-package-imports.md
  - repo: local
    hooks:
      - id: mypy
        name: mypy (entorno del proyecto, árbol completo)
        entry: python scripts/mypy_gate.py
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  # -------------------- Git / trazabilidad --------------------
  # Trailers de plan (prod-15 task_gov_trailers_09, decisión D2 opción B).
  # SOLO exige `Plan-Id`/`Task-Id` cuando la rama actual es `plan/*`; en
  # mantenimiento (master, work/*, hotfix/*, docs/*) son opcionales. Merges,
  # reverts y fixup!/squash! están exentos siempre. La regla escrita en
  # docs/context/conventions.md y la practicada coinciden por primera vez:
  # medido el 2026-07-29, solo 643 de 1460 commits no-merge llevaban Plan-Id.
  - repo: local
    hooks:
      - id: commit-trailers
        name: trailers Plan-Id/Task-Id en ramas plan/*
        entry: python scripts/check_commit_trailers.py
        language: system
        stages: [commit-msg]

  # -------------------- TypeScript / JavaScript --------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
        exclude: |
          (?x)^(
            \.venv/.*|
            node_modules/.*|
            .*\.min\.(js|css)|
            packages/sdk-python/openapi-v1\.json|
            packages/sdk-typescript/openapi-v1\.json|
            packages/sdk-typescript/src/generated/.*|
            apps/admin-panel/vendor/.*
          )$
