# Pre-commit hook configuration for the agentic platform monorepo.
# Run locally: `pre-commit install && pre-commit run --all-files`
# CI runs the same hooks in lint job; both must agree.
#
# Hooks run under whatever python pre-commit finds (typically the venv's
# interpreter). The *output* of black/ruff is pinned to py312 via
# pyproject.toml (target-version), so it's fine if the interpreter is
# newer (3.12, 3.13, etc.).

repos:
  # -------------------- generic / hygiene --------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe so docker-compose's custom tags (!reset, !override)
        # don't trip the PyYAML loader.
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
        # Windows-native scripts must keep CRLF (see .gitattributes).
        # mixed-line-ending doesn't honour .gitattributes, so we
        # exclude them explicitly here.
        exclude: \.(ps1|cmd|bat)$

  # -------------------- Python --------------------
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        # The generated Python SDK (Plan 13 task_13_13) follows the
        # generator's own style. `tool.black.extend-exclude` in pyproject is
        # IGNORED for files pre-commit passes explicitly (only force-exclude
        # applies to those), so exclude the generated dir at the hook level.
        exclude: ^packages/sdk-python/src/agentic_platform_sdk/.*$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy runs in its own pre-commit-managed venv. Runtime libs whose
  # types we import (sqlalchemy, pydantic, fastapi, ...) must be listed
  # under additional_dependencies so the type checker can resolve them.
  # Add a new lib here when a new app starts importing it.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - "sqlalchemy[asyncio]>=2.0,<3"
          - "uuid6>=2024.1"
          - "pydantic>=2.5,<3"
          - "pydantic-settings>=2.2,<3"
          - "fastapi>=0.110,<1"
          - "structlog>=24.1,<25"
          - "redis>=5.0,<6"
          - "alembic>=1.13,<2"
          - "argon2-cffi>=23.1,<24"
          - "types-python-jose>=3.3,<4"
          - "opentelemetry-api>=1.27,<2"
          - "opentelemetry-sdk>=1.27,<2"
          - "opentelemetry-instrumentation-fastapi>=0.48b0,<1"
          - "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1"
          - "opentelemetry-instrumentation-asyncpg>=0.48b0,<1"
          - "opentelemetry-instrumentation-redis>=0.48b0,<1"
          - "opentelemetry-instrumentation-httpx>=0.48b0,<1"
          - "httpx>=0.27,<1"
          - "docker>=7.1,<8"
          # Sandboxed Jinja2 template rendering (notification-dispatcher,
          # Plan 10 task_10_03). Ships py.typed, so mypy needs it installed.
          - "jinja2>=3.1,<4"
          # Email channel SMTP transport (notification-dispatcher, Plan 10
          # task_10_06). Ships py.typed, so mypy needs it installed to resolve
          # the aiosmtplib import in the Email adapter.
          - "aiosmtplib>=3.0,<4"
          # S3 remote backup destination (workers, Plan 12 task_12_05). boto3
          # itself is untyped; its TYPE stubs resolve the `mypy_boto3_s3.client`
          # import used under TYPE_CHECKING in workers.backup_destinations.
          - "boto3-stubs[s3]>=1.34,<2"
          # SFTP/NAS remote backup destination (workers, Plan 12 task_12_07).
          # paramiko ships type stubs separately; types-paramiko resolves the
          # `paramiko` import used under TYPE_CHECKING in backup_destinations.
          - "types-paramiko>=3.4,<4"
        args: [--config-file=pyproject.toml]
        files: ^(apps|packages)/.*\.py$
        # Skip files that import sibling local packages — the hook
        # venv only sees PyPI deps, not our editable apps/<x>:
        #   apps/<x>/migrations/*.py             -> uses api_server.db
        #   apps/watchdog/...                    -> uses api_server.logging
        #   apps/orchestrator/.../__main__.py    -> uses api_server.logging
        #   apps/orchestrator/.../dispatch.py    -> uses api_server.db
        #   apps/workers/.../{execution,tasks,memorizer}.py -> use api_server.db + .memorizer
        #   apps/notification-dispatcher/.../{tasks,event_mapping}.py -> use api_server.db.notification
        # Also skip tests under packages — the hook venv has no pytest
        # available and tests carry untyped decorators by design.
        # `packages/sdk-python/src/agentic_platform_sdk/*` is the GENERATED
        # Python SDK (Plan 13 task_13_13): datamodel-code-generator output +
        # a thin hand-written client. Generated style is not the repo's; it's
        # verified by tests/integration/test_sdk_python.py instead (see
        # packages/sdk-python/README.md).
        exclude: ^(apps/(([^/]+/migrations/.*)|watchdog/.*|orchestrator/src/orchestrator/(__main__|dispatch)\.py|workers/src/workers/(execution|tasks|memorizer)\.py|notification-dispatcher/src/notification_dispatcher/(tasks|event_mapping)\.py)|packages/sdk-python/src/agentic_platform_sdk/.*|packages/[^/]+/tests/.*)$

  # -------------------- TypeScript / JavaScript --------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]
        exclude: |
          (?x)^(
            \.venv/.*|
            node_modules/.*|
            .*\.min\.(js|css)|
            packages/sdk-python/openapi-v1\.json
          )$
