[project]
name = "api-server"
version = "0.0.0"
description = "FastAPI service: auth, multi-tenant middleware, admin endpoints."
requires-python = ">=3.12"
dependencies = [
  # Web framework
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",

  # Persistence
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  # pgvector adapter for SQLAlchemy + asyncpg. Plan 04: stores
  # embeddings on memory_entries and chunks (ADR pending in Fase B).
  "pgvector>=0.3,<1",
  # MinIO Python client — used by the KB document upload endpoint
  # (Plan 04 task_04_09) and the future ingestion worker. Sync; we
  # wrap it with `asyncio.to_thread` from the async router.
  "minio>=7.2,<8",

  # Validation / config
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.2,<3",
  "email-validator>=2.1,<3",

  # Auth
  "argon2-cffi>=23.1,<24",
  "python-jose[cryptography]>=3.3,<4",
  # Enterprise SSO / OIDC (Plan 08 task_08_01). Authlib drives the
  # OIDC authorization-code flow; it also ships `joserfc`, which we use
  # to verify the ID-token signature against the IdP's JWKS. Client
  # secrets are Fernet-encrypted at rest (cryptography, already present
  # via python-jose[cryptography]) or Vault-resolved.
  "authlib>=1.3,<2",
  # SAML 2.0 (Plan 08 task_08_04). python3-saml drives the SP-initiated
  # AuthnRequest + the ACS assertion validation. It binds the NATIVE
  # xmlsec/libxml2 libraries, which can fail to install on some hosts;
  # the api-server imports it LAZILY inside the SAML flow so a node
  # without the native backend still boots (SAML reports 501 there).
  "python3-saml>=1.16,<2",
  # MFA TOTP (Plan 08 task_08_09). pyotp implements RFC 6238 TOTP — the
  # per-user secret, the otpauth:// provisioning URI an authenticator app
  # scans, and the time-window verification. Pure-Python, no native deps.
  # The TOTP secret is Fernet-encrypted at rest (same mechanism as the
  # OIDC client secret) and recovery codes are stored only as SHA-256
  # digests, so nothing TOTP-related is ever persisted in clear.
  "pyotp>=2.9,<3",

  # Cache / session store / rate limit
  "redis[hiredis]>=5.0,<6",

  # UUID v7 (built-in in PG17+; we keep generating client-side for now)
  "uuid6>=2024.1",

  # Observability
  "structlog>=24.1,<25",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1",
  "opentelemetry-instrumentation-asyncpg>=0.48b0,<1",
  "opentelemetry-instrumentation-redis>=0.48b0,<1",
  "opentelemetry-instrumentation-httpx>=0.48b0,<1",

  # HTTP client (used by tests, watchdog, integrations)
  "httpx>=0.27,<1",

  # Multi-agent planning sub-graph (Plan 03 Fase C).
  "langgraph>=0.2,<1",

  # Vault client — backs `HvacVaultResolver` for MCP auth injection
  # (Plan 05 task_05_05/task_05_17). Sync API; we wrap in to_thread
  # from the async endpoints if needed.
  "hvac>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5.0,<6",
  "freezegun>=1.5,<2",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_server"]
