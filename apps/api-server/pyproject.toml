[project]
name = "api-server"
version = "0.0.0"
description = "FastAPI service: auth, multi-tenant middleware, admin endpoints."
requires-python = ">=3.12"
dependencies = [
  # Web framework
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",

  # Persistence
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  # pgvector adapter for SQLAlchemy + asyncpg. Plan 04: stores
  # embeddings on memory_entries and chunks (ADR pending in Fase B).
  "pgvector>=0.3,<1",
  # MinIO Python client — used by the KB document upload endpoint
  # (Plan 04 task_04_09) and the future ingestion worker. Sync; we
  # wrap it with `asyncio.to_thread` from the async router.
  "minio>=7.2,<8",

  # Validation / config
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.2,<3",
  "email-validator>=2.1,<3",

  # Auth
  "argon2-cffi>=23.1,<24",
  # ONE JOSE stack (prod-09 task_prod09_17, quality-10). `joserfc` signs and
  # verifies BOTH token families — human sessions (`auth/jwt.py`) and the
  # worker→api tokens (`auth/internal_agent.py`) — and verifies OIDC ID tokens
  # against the IdP's JWKS (`auth/sso/oidc.py`). It used to arrive only
  # transitively via authlib while `python-jose` did the session half; declared
  # explicitly now that production code imports it directly. NOTE for anyone
  # touching `auth/jwt.py`: joserfc's `jwt.decode` does NOT validate `exp` —
  # that is a separate `JWTClaimsRegistry` call. See the docstring there.
  "joserfc>=1.0,<2",
  # Enterprise SSO / OIDC (Plan 08 task_08_01). Authlib drives the
  # OIDC authorization-code flow. Client secrets are Fernet-encrypted at rest,
  # which is why `cryptography` is declared below on its own account: it used to
  # ride in as the `python-jose[cryptography]` extra, and dropping python-jose
  # would otherwise have left a direct import with no declared source.
  "authlib>=1.3,<2",
  # Suelo 50 por CVE, no por compatibilidad (SCA 2026-08-13): 46.0.7 —el techo
  # que imponía el `<47` anterior— arrastra CVE-2026-69247 (oráculo de
  # Bleichenbacher en pkcs7_decrypt_der, corregido en 50.0.0), CVE-2026-69248 y
  # CVE-2026-69249 (49.0.0) y GHSA-537c-gmf6-5ccf (48.0.1). Nada de lo que las
  # majors 47→50 rompieron nos toca: usamos Fernet, Ed25519 y x509, no los
  # alias de tipos retirados en 49 ni ChaCha20/FFDH/pkcs7.
  "cryptography>=50,<51",
  # SAML 2.0 (Plan 08 task_08_04). python3-saml drives the SP-initiated
  # AuthnRequest + the ACS assertion validation. It binds the NATIVE
  # xmlsec/libxml2 libraries, which can fail to install on some hosts;
  # the api-server imports it LAZILY inside the SAML flow so a node
  # without the native backend still boots (SAML reports 501 there).
  "python3-saml>=1.16,<2",
  # MFA TOTP (Plan 08 task_08_09). pyotp implements RFC 6238 TOTP — the
  # per-user secret, the otpauth:// provisioning URI an authenticator app
  # scans, and the time-window verification. Pure-Python, no native deps.
  # The TOTP secret is Fernet-encrypted at rest (same mechanism as the
  # OIDC client secret) and recovery codes are stored only as SHA-256
  # digests, so nothing TOTP-related is ever persisted in clear.
  "pyotp>=2.9,<3",
  # MFA WebAuthn / FIDO2 (Plan 08 task_08_10). py_webauthn implements the
  # W3C WebAuthn server ceremony: it builds the registration / authentication
  # options the browser passes to navigator.credentials, and verifies the
  # attestation / assertion the authenticator returns. Pure-Python (it binds
  # `cryptography`, declared above), so it is
  # fully testable offline with crafted fixtures — no real authenticator. We
  # store only the credential id + COSE public key + signature counter; the
  # public key is not a secret, and the counter is what defeats cloned-token
  # replay (a stale counter is rejected).
  "webauthn>=2.2,<3",

  # Cache / session store / rate limit
  "redis[hiredis]>=5.0,<6",

  # Celery PRODUCER side: the api-server enqueues tasks (human_inbox approvals,
  # notifications, …) onto the broker via `api_server.celery_client`. It does
  # NOT run workers, but it imports `celery` at module load, so the package must
  # ship in the api-server image — otherwise it crash-loops on boot with
  # "ModuleNotFoundError: No module named 'celery'" (prod-01: the dev .venv hid
  # this because the workers package pulled celery in transitively). Same
  # constraint as apps/workers so producer + consumer stay protocol-compatible.
  "celery[redis]>=5.4,<6",

  # UUID v7 (built-in in PG17+; we keep generating client-side for now)
  "uuid6>=2024.1",

  # Observability
  "structlog>=24.1,<25",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  # RETIRADA `opentelemetry-instrumentation-sqlalchemy` (ADR 0140, prod-08
  # task_prod08_otel_cleanup_13): estaba declarada desde la fase 0 y
  # `SQLAlchemyInstrumentor` no se invocaba en ningún sitio. Peso muerto en la
  # imagen + un docstring que prometía un tracing de queries inexistente.
  # `tests/unit/test_telemetry_setup.py` impide que vuelva, y generaliza la
  # guarda a cualquier `opentelemetry-instrumentation-*` sin llamante.

  # Exporter Prometheus (prod-08 Fase B, hallazgo observability-2). Se elige
  # `prometheus_client` a pelo y NO `prometheus-fastapi-instrumentator`: una
  # dependencia menos y control total sobre los labels, que es donde está el
  # riesgo real (cardinalidad). Pure-Python, sin deps transitivas.
  #
  # IMPORTANTE para el despliegue: las imágenes de workers,
  # notification-dispatcher y orchestrator se construyen SOBRE la de
  # api-server, así que este paquete las alcanza a todas con un solo build.
  "prometheus-client>=0.20,<1",
  "opentelemetry-instrumentation-asyncpg>=0.48b0,<1",
  "opentelemetry-instrumentation-redis>=0.48b0,<1",
  "opentelemetry-instrumentation-httpx>=0.48b0,<1",

  # HTTP client (used by tests, watchdog, integrations)
  "httpx>=0.27,<1",

  # Multi-agent planning sub-graph (Plan 03 Fase C).
  "langgraph>=1.2,<2",

  # Vault client — backs `HvacVaultResolver` for MCP auth injection
  # (Plan 05 task_05_05/task_05_17). Sync API; we wrap in to_thread
  # from the async endpoints if needed.
  "hvac>=2.0,<3",

  # XLSX export for the tenant statistics / runs explorer (Plan 14
  # task_14_14). A pure-Python, pip-clean wheel (its only dep, et_xmlfile,
  # is also pure-Python) — no native libraries, unlike a PDF renderer. The
  # export router imports it LAZILY and degrades to a clean 501 if absent
  # (xmlsec/python3-saml precedent), so the api-server still boots without
  # it; the dependency is declared here so the wheel ships by default. The
  # PDF format is a print-ready HTML document (browser "Save as PDF"), so
  # no heavy native PDF dependency is pulled.
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "freezegun>=1.5,<2",
  # Marketplace pre-install static analysis (Plan 09 task_09_05). Bandit
  # is the primary scanner — a clean, pure-Python wheel run as a
  # subprocess on a temp copy of the analyzed code (never imported/exec'd).
  # semgrep is the SECOND scanner but is deliberately NOT pinned here: its
  # published wheel hard-pins opentelemetry/protobuf versions that conflict
  # with this project's stack (installing it downgrades OTel and breaks the
  # api-server import). The StaticAnalyzer imports semgrep LAZILY (locates
  # its CLI) and degrades to a typed "unavailable" result when absent —
  # the xmlsec/python3-saml precedent. CI/Linux that ships semgrep on PATH
  # exercises that path; elsewhere the semgrep-specific tests skip-guard.
  "bandit>=1.7,<2",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_server"]
