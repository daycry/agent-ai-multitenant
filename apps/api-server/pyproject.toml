[project]
name = "api-server"
version = "0.0.0"
description = "FastAPI service: auth, multi-tenant middleware, admin endpoints."
requires-python = ">=3.12"
dependencies = [
  # Web framework
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",

  # Persistence
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  # pgvector adapter for SQLAlchemy + asyncpg. Plan 04: stores
  # embeddings on memory_entries and chunks (ADR pending in Fase B).
  "pgvector>=0.3,<1",
  # MinIO Python client — used by the KB document upload endpoint
  # (Plan 04 task_04_09) and the future ingestion worker. Sync; we
  # wrap it with `asyncio.to_thread` from the async router.
  "minio>=7.2,<8",

  # Validation / config
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.2,<3",
  "email-validator>=2.1,<3",

  # Auth
  "argon2-cffi>=23.1,<24",
  "python-jose[cryptography]>=3.3,<4",

  # Cache / session store / rate limit
  "redis[hiredis]>=5.0,<6",

  # UUID v7 (built-in in PG17+; we keep generating client-side for now)
  "uuid6>=2024.1",

  # Observability
  "structlog>=24.1,<25",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1",
  "opentelemetry-instrumentation-asyncpg>=0.48b0,<1",
  "opentelemetry-instrumentation-redis>=0.48b0,<1",
  "opentelemetry-instrumentation-httpx>=0.48b0,<1",

  # HTTP client (used by tests, watchdog, integrations)
  "httpx>=0.27,<1",

  # Multi-agent planning sub-graph (Plan 03 Fase C).
  "langgraph>=0.2,<1",

  # Vault client — backs `HvacVaultResolver` for MCP auth injection
  # (Plan 05 task_05_05/task_05_17). Sync API; we wrap in to_thread
  # from the async endpoints if needed.
  "hvac>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5.0,<6",
  "freezegun>=1.5,<2",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_server"]
