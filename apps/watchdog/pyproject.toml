[project]
name = "watchdog"
version = "0.0.0"
description = "Container health watchdog with exponential backoff."
requires-python = ">=3.12"
dependencies = [
  "docker>=7.1,<8",
  "structlog>=24.1,<25",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
]

[project.scripts]
watchdog = "watchdog.__main__:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watchdog"]
