[project]
name = "workers"
version = "0.0.0"
description = "Celery workers: pick up jobs and manage agent-runtime containers."
requires-python = ">=3.12"
dependencies = [
  # Task queue
  "celery[redis]>=5.4,<6",

  # Validation / config
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.2,<3",

  # Observability
  "structlog>=24.1,<25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workers"]
