# Bootstrap compose for the TEMPORARY installer (Plan 15 Fase A).
#
# This file is intentionally SEPARATE from docker/docker-compose.yml: the
# installer is a self-destructing, throwaway container that runs ONLY during
# first-time provisioning. It is NOT wired into the runtime stack.
#
# ---------------------------------------------------------------------------
# WHAT THIS ACTUALLY DOES TODAY: it serves a SIMULATION.
#
# The backend served here binds `FakeStepExecutor` by default (main.py,
# `_default_step_executor`). Bringing this up shows the nine steps and streams
# progress, but it provisions NOTHING, and the credentials + Vault unseal keys
# it reveals at step 9 are thrown-away values that open nothing. Use it to
# review the flow and the copy; do NOT use it to install.
#
# Desde el 2026-08-28 ese aviso ya no vive SÓLO en este comentario, que es medio
# defecto en sí mismo: el navegador no muestra comentarios de YAML. El wizard
# lleva banda permanente y diálogo bloqueante (`app/simulation-notice.tsx`), y el
# backend responde 501 en los dos endpoints que fingen salvo que alguien encienda
# `INSTALLER_ALLOW_SIMULATION` — que es lo que hace este fichero, abajo y a la
# vista, para que levantar la fachada sea un acto consciente y no un descuido.
#
# The REAL install path is the CLI:
#   ./scripts/install.sh --config install.yaml
# which wires the real bindings and aborts with exit code 4 (PROVISION) if it
# ever detects a simulation seam without --dry-run. See
# docs/06-runbooks/01-installation-from-scratch.md.
# ---------------------------------------------------------------------------
#
# Bring it up on a fresh host (a clone is REQUIRED — both services are `build:`
# and no installer image is published anywhere):
#   docker compose -f apps/installer/docker-compose.installer.yml up -d --build
# then open the wizard at http://localhost:3100, and tear it down with:
#   docker compose -f apps/installer/docker-compose.installer.yml down
#
# NO HOST MOUNTS ARE DECLARED HERE, AND THAT IS NOT JUST A PENDING TASK.
# The "Phase B" plan was for this backend to mount the host docker socket and
# the data root so it could provision the stack itself. That is precisely the
# alternative ADR 0060 rejected in writing (socket in a container == effective
# root on the host), and the socket-proxy is not a way around it: its ACL
# denies VOLUMES, while the installer needs host bind-mounts to write
# /data/agent-platform.
#
# Eso YA NO es una decisión abierta: el operador firmó el ADR 0161 el 2026-08-27
# y la respuesta a su pregunta 3 es «genera, no provisiona». Añadir aquí un
# `docker.sock`, un `DOCKER_HOST` o un `privileged: true` no es completar una
# fase pendiente: es reabrir por la puerta de atrás lo que el ADR 0060 rechazó
# por escrito.

name: agentic-platform-installer

services:
  installer-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # El ENTRYPOINT de la imagen es el CLI (`python -m installer_backend.cli`),
    # porque la forma publicada de usarla es `docker run … generate --config …`
    # (ADR 0161, la séptima imagen de release-images.yml). El wizard HTTP sigue
    # dentro y se alcanza sobrescribiéndolo aquí. Sin esta línea el contenedor
    # imprimiría el `--help` del CLI y el healthcheck se quedaría esperando un
    # /healthz que nadie sirve.
    entrypoint: ["installer-backend"]
    environment:
      # 0.0.0.0 DENTRO del contenedor es correcto —es como uvicorn oye lo que
      # llega por el bind de abajo—; lo que acota la exposición es el `ports`.
      INSTALLER_HOST: 0.0.0.0
      INSTALLER_PORT: 8080
      # Autoriza la SIMULACIÓN. Sin esto el backend sirve los pasos 1-7 (que son
      # reales: captura + validación + preview) y responde 501 en los dos que
      # fingen, `/api/install/stream` y `/api/finalize/reveal`. Ese es el defecto
      # correcto para la imagen publicada; aquí se enciende a propósito, porque
      # revisar el flujo es exactamente para lo que existe este compose. Va
      # escrito y no heredado del entorno para que un `docker compose config` lo
      # enseñe.
      INSTALLER_ALLOW_SIMULATION: "1"
    ports:
      # SÓLO loopback. Este backend no tiene autenticación de ningún tipo y su
      # CORS es `allow_origins=["*"]`: publicado como "8080:8080" quedaba en
      # TODAS las interfaces del host. El ADR 0161 ya nombró ese riesgo al
      # descartar su opción A. Si alguna vez hace falta alcanzarlo desde otra
      # máquina, la respuesta es un túnel SSH, no quitar el `127.0.0.1`.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://localhost:8080/healthz'); sys.exit(0)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

  installer-ui:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # The wizard talks to the backend over the host (browser-side fetch), so
      # it points at the published backend port, not the compose service name.
      NEXT_PUBLIC_INSTALLER_API: http://localhost:8080
    ports:
      # Loopback, igual que el backend: el wizard no autentica a nadie y, hasta
      # el paso 7, recoge dominio, claves de MinIO y tokens de proveedores LLM.
      - "127.0.0.1:3100:3100"
    depends_on:
      installer-backend:
        condition: service_healthy
    restart: "no"
