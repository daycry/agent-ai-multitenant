# Configuración tinyproxy del registry-proxy (ADR 0094). Lee el ADR 0094 para
# entender por qué existe este servicio (egress de runtime-templates a registries
# de paquetes, separado del egress-proxy LLM).

User tinyproxy
Group tinyproxy

# Puerto en el que escucha. No hay port mapping al host; el worker conecta este
# proxy a los bridges efímeros per-task y los runtimes lo alcanzan por su alias.
Port 8888
Listen 0.0.0.0

Timeout 600
LogLevel Notice

# El cliente nunca verá la cabecera `Via: ...` que tinyproxy añade por defecto.
DisableViaHeader Yes

# Allowlist de IPs cliente — las redes privadas que docker asigna a sus bridges.
# Cualquier host externo intentando usar el proxy sería rechazado.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Allowlist de hosts destino: `FilterDefaultDeny` invierte la semántica de Filter
# — sólo los hosts que casan algún regex en /etc/tinyproxy/filter salen, todo lo
# demás se bloquea con 403.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended Yes
FilterURLs Off

# Únicos puertos permitidos para CONNECT (HTTPS). Sin esto un runtime podría
# túnelar a cualquier servicio TCP arbitrario por el 443.
ConnectPort 443
ConnectPort 8443
