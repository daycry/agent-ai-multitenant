[project]
name = "orchestrator"
version = "1.0.0"
description = "Task orchestrator: consumes domain events from Redis Streams and assigns work."
requires-python = ">=3.12"
dependencies = [
  # Web framework (healthz + control endpoints)
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.30,<1",

  # Event bus
  "redis[hiredis]>=5.0,<6",

  # Validation / config
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.2,<3",

  # Observability
  "structlog>=24.1,<25",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
orchestrator = "orchestrator.__main__:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
