[project]
name = "notification-dispatcher"
version = "0.0.0"
description = "Notification dispatcher: Celery service that delivers multichannel notifications and logs every send."
requires-python = ">=3.12"
dependencies = [
  # Task queue
  "celery[redis]>=5.4,<6",

  # Persistence — looks up channels / writes notification_logs (BYPASSRLS).
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "redis>=5.0,<6",

  # Secrets at rest — Fernet decrypt of channel secrets (never plaintext).
  "cryptography>=42,<49",

  # Validation / config
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.2,<3",

  # Observability
  "structlog>=24.1,<25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_dispatcher"]
