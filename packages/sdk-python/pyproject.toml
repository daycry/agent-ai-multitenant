[project]
name = "agentic-platform-sdk"
version = "0.1.0"
description = "Official Python SDK for the Agentic Platform public v1 API (Plan 13)."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.5,<3",
]

[project.optional-dependencies]
# datamodel-code-generator regenerates `models.py` from the v1 OpenAPI spec
# (scripts/generate.py). Only needed to RE-generate the SDK, not to use it.
dev = [
  "datamodel-code-generator>=0.25",
  "pytest>=9.1,<10",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_platform_sdk"]
