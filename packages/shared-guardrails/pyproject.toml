[project]
name = "shared-guardrails"
version = "0.0.0"
description = "Declarative guardrails engine for the agentic platform (Plan 11)."
requires-python = ">=3.12"
dependencies = [
  # Declarative pipeline config is authored as YAML (editable from the
  # admin panel later); PyYAML parses it into the dict the engine loads.
  "PyYAML>=6.0,<7",
  # The `output_structure` guardrail (task_11_09) validates structured model
  # output against a JSON Schema. jsonschema is a lightweight, pure-Python
  # dependency (no model, no native extension), so unlike the Presidio /
  # content-safety extras it is a *base* dep — the engine stays importable
  # everywhere incl. CI.
  "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "types-PyYAML>=6.0,<7",
]
# PII detection backend (task_11_04). Microsoft Presidio pulls spaCy + an
# NER model — a multi-hundred-MB dependency — so it is OPTIONAL and lazy:
# the `pii` guardrail imports it on first use and degrades to a
# pure-Python regex fallback / a typed "unavailable" result when absent,
# keeping the engine importable and CI free of the heavy model. Installing
# this extra still requires a spaCy model, e.g.
#   python -m spacy download en_core_web_lg
pii = [
  "presidio-analyzer>=2.2,<3",
]
# Content-safety guard model (task_11_07). The classifier is a guard LLM
# (LlamaGuard / ShieldGemma) reached through the platform LLM layer
# (`shared-llm`) — a heavy *runtime* dependency (a running Ollama / provider
# serving the guard model), so it is OPTIONAL and lazy: the `content_safety`
# guardrail drives it behind an injectable `SafetyClassifier` seam and the
# `LLMSafetyClassifier` adapter imports `shared-llm` only when a provider is
# supplied. When no guard model is configured the guardrail degrades to a
# typed "unavailable" result (never a fake "safe" verdict), keeping the
# engine importable and CI free of the model.
content-safety = [
  "shared-llm",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_guardrails"]
