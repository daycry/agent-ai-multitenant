[project]
name = "shared-guardrails"
version = "0.0.0"
description = "Declarative guardrails engine for the agentic platform (Plan 11)."
requires-python = ">=3.12"
dependencies = [
  # Declarative pipeline config is authored as YAML (editable from the
  # admin panel later); PyYAML parses it into the dict the engine loads.
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_guardrails"]
