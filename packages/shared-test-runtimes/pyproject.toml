[project]
name = "shared-test-runtimes"
version = "0.0.0"
description = "Runtime template schema + catalog for heterogeneous test execution (Plan 06)."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_test_runtimes"]
