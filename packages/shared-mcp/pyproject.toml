[project]
name = "shared-mcp"
version = "0.0.0"
description = "Unified async MCP client for the agentic platform (Plan 05)."
requires-python = ">=3.12"
dependencies = [
  # SDK oficial de Anthropic. Cubre los 3 transports del spec MCP
  # (stdio, sse, streamable_http) + el protocolo JSON-RPC. Nuestro
  # MCPClient envuelve esto con una API uniforme + auth-injection
  # via Vault (task_05_05).
  "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_mcp"]
