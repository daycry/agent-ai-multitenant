[project]
name = "shared-domain"
version = "0.0.0"
description = "Shared domain constants for the agentic platform: canonical tool-name source of truth (ADR 0048)."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_domain"]
