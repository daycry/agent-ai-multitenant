# =============================================================================
# Perfil de instalación: RECOMMENDED  (Plan 15 — task_15_11)
# =============================================================================
# Un `install.yaml` completo que el CLI desatendido acepta:
#   ./scripts/install.sh --config scripts/install-profiles/recommended.yaml
# (equivale a `python -m installer_backend.cli install --config <fichero>`).
#
# Configuración POR DEFECTO sugerida para una instalación de producción en una
# máquina dimensionada de forma razonable:
#   - Recursos cómodos: 4 workers, 8 GiB por worker.
#   - SIN GPU (el grueso del trabajo va a proveedores gestionados).
#   - DOS proveedores LLM habilitados (Azure AI Foundry vía APIM + Ollama),
#     para tener redundancia entre un proveedor empresarial y uno local.
#
# SECRETOS — IMPORTANTE
# ---------------------
# Los valores `*_secret_key`, `*oauth_token*` y `api_key` de ESTE fichero son
# MARCADORES de ejemplo (placeholders). Antes de un install real, SUSTITÚYELOS
# por secretos de alta entropía propios y NO comitees el fichero resultante.
# El instalador escribe los secretos generados en Vault y los muestra UNA vez.
# -----------------------------------------------------------------------------

# Paso 2 — sistema: dominio + entorno.
system:
  domain: agentic.example.com
  environment: production

# Paso 3 — recursos / GPU: dimensionado recomendado para producción media.
resources:
  worker_replicas: 4
  worker_memory_gib: 8
  gpu_enabled: false

# Paso 4 — almacenamiento: raíz de datos + bucket de MinIO.
storage:
  data_root: /data/agent-platform
  minio_bucket: agentic-platform
  minio_access_key: CHANGE_ME_minio_access
  minio_secret_key: CHANGE_ME_minio_secret_placeholder_value

# Paso 5 — proveedores LLM (catálogo cerrado ADR-0021).
# Recomendado: un proveedor empresarial (Azure AI Foundry vía APIM) + uno local
# (Ollama) para redundancia.
providers:
  azure_foundry:
    enabled: true
    apim_endpoint: https://apim.example.com/openai
    api_key: CHANGE_ME_azure_apim_key_placeholder
  ollama:
    enabled: true
    endpoint: http://ollama:11434

# Paso 6 — tenant inicial + usuario administrador.
tenant:
  tenant_name: Acme
  admin_email: admin@acme.com

# Puertos publicados en el host (por defecto el compose canónico).
ports:
  admin_panel: 3000
  api_server: 8000
  minio_console: 9001
