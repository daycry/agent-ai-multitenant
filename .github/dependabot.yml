# Dependabot — la vía REACTIVA de la cadena de suministro (plan prod-11,
# task_dependabot_02, hallazgo gap5-2).
#
# Por qué existe y por qué va PRIMERO: este plan pinea las bases Docker por
# `@sha256:` y las GitHub Actions por SHA de commit. Un digest pineado SIN
# mecanismo de refresco es PEOR que un tag flotante — congela sus CVEs para
# siempre (riesgo 3 de prod-11). Dependabot es ese mecanismo: mantiene los
# digests, los SHAs de las actions y las versiones al día proponiendo PRs que
# pasan por el mismo `security-scan` de ci.yml.
#
# Control de volumen (riesgo 1): 14 distribuciones Python + 2 superficies npm +
# 19 directorios con Dockerfile + las actions pueden generar decenas de PRs
# semanales y matar el gate por fatiga. Cada entrada agrupa minor+patch en UN
# PR por ecosistema y limita los PRs abiertos a 5. Las MAJOR siguen viniendo
# sueltas a propósito: son las que rompen y merecen revisión individual.
#
# Quién revisa estos PRs y con qué criterio: docs/06-runbooks/triage-vulnerabilidades.md
version: 2

updates:
  # ---------------------------------------------------------------------
  # Python — las 14 distribuciones del monorepo.
  # "/" cubre el pyproject.toml de la raíz Y requirements-dev.txt (el
  # toolchain: black/ruff/mypy/pytest), que estaba fuera de todo control.
  # ---------------------------------------------------------------------
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/apps/api-server"
      - "/apps/installer/backend"
      - "/apps/notification-dispatcher"
      - "/apps/orchestrator"
      - "/apps/watchdog"
      - "/apps/workers"
      - "/packages/*"
      - "/docker/agent-runtimes/agent-runtime"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------
  # npm — las 2 superficies del repo. El frontend del installer no entra en
  # el lint de CI (eso es alcance de prod-02), pero SÍ es superficie SCA:
  # se despliega en el arranque y sirve HTML al operador.
  # ---------------------------------------------------------------------
  - package-ecosystem: "npm"
    directories:
      - "/apps/admin-panel"
      - "/apps/installer"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------
  # Docker — los 19 directorios con Dockerfile bajo docker/. Es la entrada
  # que hace sostenible el digest-pinning de task_digest_pin_11: Dependabot
  # reescribe `@sha256:…` y el tag del comentario a la vez.
  #
  # Los Dockerfiles de apps/ que derivan de la imagen BASE (api-server,
  # workers, orchestrator, notification-dispatcher, watchdog) NO entran aquí:
  # su `FROM` es un `ARG BASE_IMAGE`, no una descarga de un registry, así que
  # no hay digest que refrescar. Su ciclo de vida lo gobierna
  # prod-01-despliegue-ejecutable.
  #
  # Los TRES de apps/ que sí pinean una base externa por digest sí entran, y
  # entraron tarde: hasta el 2026-08-28 tenían el digest congelado y ninguna
  # vía de refresco, que es exactamente lo que la cabecera de este fichero
  # llama «PEOR que un tag flotante». Son la imagen del instalador —la única
  # que un operador se descarga en el camino sin clon (ADR 0161)—, el wizard
  # de arranque y el admin-panel. Las copias de `docker/` que viajan dentro
  # del paquete del instalador (`stack_assets/`) NO entran: son idénticas a su
  # original, que ya está cubierto arriba, y una segunda entrada crearía dos
  # fuentes de verdad para el mismo digest.
  # ---------------------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/docker/agent-runtimes/*"
      - "/docker/egress-proxy"
      - "/docker/registry-proxy"
      - "/docker/whatsapp-neonize"
      - "/apps/installer"
      - "/apps/installer/backend"
      - "/apps/admin-panel"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"
    # -------------------------------------------------------------------
    # Por que hay un `ignore` ademas del filtro de `update-types`
    # -------------------------------------------------------------------
    # El grupo ya declaraba `update-types: [minor, patch]`, y aun asi el PR
    # #130 subia `python:3.12 -> 3.14`, `php:8.3 -> 8.5`, `golang:1.26 ->
    # 1.27`, `rust:1.97 -> 1.98` y `maven:3.9-eclipse-temurin-21 ->
    # maven:3-eclipse-temurin-26`. No es que el filtro fallara: es que para
    # dependabot un tag `python:3.12` tiene major=3 y minor=12, asi que subir a
    # 3.14 ES un update "minor". Para el lenguaje son DOS releases de features.
    #
    # La guarda existia, estaba configurada, y no protegia lo que todo el mundo
    # creia que protegia, porque la nocion de "minor" del tag no es la del
    # lenguaje. Ese desajuste es el defecto, no el bump.
    #
    # Lo que se rompia en concreto, y por eso no es una preferencia estetica:
    #
    #   * `CLAUDE.md` fija **Python 3.12** como lenguaje backend. El bump lo
    #     subia a 3.14 en cinco Dockerfiles, el del instalador incluido.
    #   * `maven:3.9-...` pasaba a `maven:3-...`: eso AFLOJA un pin, que este
    #     repo prohibe expresamente, y encima cambiaba Java 21 (LTS) por 26.
    #   * `php:8.3 -> 8.5` contradecia el comentario escrito justo encima del
    #     `FROM` en php-phpunit y php-pest: «La version de PHP no cambia — sube
    #     el snapshot de Debian». Cambiar la version del lenguaje bajo el que
    #     corren los tests de TODOS los proyectos del sistema es una decision,
    #     no una linea dentro de un grupo llamado `docker-bases`.
    #
    # Lo que este `ignore` NO bloquea, y es justo lo que el grupo existe para
    # traer: los **refrescos de digest** del MISMO tag. Dependabot los trata
    # aparte de los updates semver, asi que `python:3.12-slim@sha256:vieja`
    # sigue llegando como `python:3.12-slim@sha256:nueva` con sus CVE de Debian
    # corregidas. El pin sin refresco es «PEOR que un tag flotante» segun la
    # cabecera de este fichero, y eso se conserva intacto.
    #
    # Subir de version un lenguaje sigue siendo posible: se hace a mano, con su
    # ADR, midiendo que el ecosistema acompana. Que es como se decidio 3.12.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "php"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "rust"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "maven"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "node"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "gradle"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "ruby"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      docker-bases:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------
  # GitHub Actions — mantiene al día los SHAs de commit que pinea
  # task_actions_sha_03. Sin esta entrada, pinear por SHA sería congelar
  # las actions (incluidas sus propias correcciones de seguridad).
  # ---------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
