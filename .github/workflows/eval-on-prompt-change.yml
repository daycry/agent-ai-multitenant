name: Eval on prompt change

# Plan 14 task_14_07 — when a PR/push CHANGES an agent prompt definition, run
# the eval harness: refresh the golden-dataset run for the new prompt version,
# diff it against the baseline (task_14_06) and apply the merge-gate
# (task_14_08). This workflow is ADDITIVE — it does not touch ci.yml.
#
# CI has NO LLM provider keys by default, so the live harness step is GATED on
# a provider secret being present and otherwise skips with a notice (the CLI is
# invoked with --dry-run, which validates config + exits 0 without an LLM
# call).
#
# --- MODO GATE (endurecido el 2026-08-19, `task_gov_04`) --------------------
# Hasta hoy la rama VIVA de este workflow no podia bloquear nada, por dos
# defectos que se tapaban entre si:
#
#   1. `ci_run.main` devolvia PASS cuando no habia productor de diff («nothing
#      to gate, treating as pass»), y en el repo NO hay ningun productor vivo.
#      O sea que la rama con secreto solo podia salir en verde. Arreglado: ese
#      camino es ahora INCONCLUSIVE (exit 2) - no-cero y distinto del 1 de una
#      regresion, porque piden arreglos distintos.
#   2. Los tres argumentos se interpolaban de variables que NADIE definia
#      (`${EVAL_GOLDEN_DATASET}` se expandia a la cadena vacia) y el agente
#      salia de un default inventado `:-changed-prompt-agent`. Arreglado: se
#      leen de `vars.*`, sin defaults, y la CLI rechaza un valor en blanco.
#
# `continue-on-error: false` explicito en vez de omitir la linea, mismo criterio
# que el SCA de ci.yml: el modo del job debe estar A LA VISTA y volver a informe
# tiene que ser una decision escrita, no una ausencia. Lo exigen
# `test_the_gate_job_declares_its_mode` y `test_the_gate_job_is_enforcing` de
# tests/unit/test_eval_gate_config.py.
#
# LO QUE SIGUE SIENDO DEL OPERADOR (`task_gov_04`): dar de alta el secreto del
# proveedor, sembrar el dataset golden real y definir las tres variables de
# repositorio. Y falta el cableado del productor de diff vivo, que necesita
# sesion tenant-bound + proveedor LLM. Mientras falte cualquiera de las dos
# cosas, la rama viva NO se activa (cae en --dry-run con un aviso que dice que
# falta) o sale INCONCLUSIVE - nunca en verde-que-no-comprueba.

on:
  push:
    branches: [master, "plan/**"]
    paths:
      # Agent prompt definitions (the built-in agents ship bilingual
      # system_prompt text here; promotion/eval grades against these).
      - "apps/api-server/src/api_server/seeds/builtin_agents.py"
      - "apps/api-server/src/api_server/seeds/qa_e2e_automator.py"
      # The eval harness itself — re-run the gate when the judge/diff/CI
      # logic that decides regressions changes.
      - "apps/api-server/src/api_server/evals/**"
      - ".github/workflows/eval-on-prompt-change.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/api-server/src/api_server/seeds/builtin_agents.py"
      - "apps/api-server/src/api_server/seeds/qa_e2e_automator.py"
      - "apps/api-server/src/api_server/evals/**"
      - ".github/workflows/eval-on-prompt-change.yml"
  workflow_dispatch:

# Cancel in-progress runs of the same workflow on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-on-prompt-change:
    name: Eval prompt change (regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Modo GATE, no informe: una regresion de calidad rompe el build (ADR 0038,
    # decision 3). Explicito a proposito - ver la cabecera del fichero.
    continue-on-error: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the api-server (editable) so api_server.evals imports
        run: |
          python -m pip install --upgrade pip
          # shared-llm is a path dep (ADR 0021); install it first so the
          # api-server editable install resolves the local wheel.
          python -m pip install -e "packages/shared-llm[dev]" -c constraints.txt
          python -m pip install -e "apps/api-server[dev]" -c constraints.txt

      # Decide once whether the live gate CAN run. Two conditions, not one:
      #
      #   * un secreto de proveedor (cualquiera de los cuatro caminos del
      #     catalogo, ADR 0021), y
      #   * la configuracion del eval: que agente se evalua, contra que dataset
      #     golden y contra que run baseline.
      #
      # La segunda condicion es nueva (`task_gov_04`). Sin ella, un operador que
      # diera de alta la credencial sin sembrar el dataset activaria la rama viva
      # y se encontraria el gate en INCONCLUSIVE (exit 2) en cada PR, sin saber
      # que le falta. Con las dos, ese caso cae en la rama --dry-run con un aviso
      # que nombra exactamente lo que falta.
      - name: Detect LLM provider secret + eval configuration
        id: provider
        env:
          # Any one of the catalog's four provider paths (ADR 0021) is enough
          # to run a real eval. None set => empty => harness skipped.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          COPILOT_OAUTH_TOKEN: ${{ secrets.COPILOT_OAUTH_TOKEN }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          # Configuracion del eval - variables de REPOSITORIO (Settings ->
          # Variables), no secretos: son ids, no credenciales.
          EVAL_SUBJECT_AGENT: ${{ vars.EVAL_SUBJECT_AGENT }}
          EVAL_GOLDEN_DATASET: ${{ vars.EVAL_GOLDEN_DATASET }}
          EVAL_BASELINE_RUN: ${{ vars.EVAL_BASELINE_RUN }}
        run: |
          has_secret=false
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$AZURE_OPENAI_API_KEY" ] \
            || [ -n "$COPILOT_OAUTH_TOKEN" ] || [ -n "$OLLAMA_BASE_URL" ]; then
            has_secret=true
          fi

          missing=""
          [ -n "$EVAL_SUBJECT_AGENT" ] || missing="$missing EVAL_SUBJECT_AGENT"
          [ -n "$EVAL_GOLDEN_DATASET" ] || missing="$missing EVAL_GOLDEN_DATASET"
          [ -n "$EVAL_BASELINE_RUN" ] || missing="$missing EVAL_BASELINE_RUN"

          if [ "$has_secret" = "true" ] && [ -z "$missing" ]; then
            echo "has_provider=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_provider=false" >> "$GITHUB_OUTPUT"
            if [ "$has_secret" != "true" ]; then
              echo "::notice::No LLM provider secret present — running the eval CI gate in dry-run (skip-with-notice)."
            else
              echo "::warning::A provider secret IS present but the eval configuration is incomplete (missing:$missing). The live regression gate CANNOT run: set those repository variables (Settings -> Variables) and seed the golden dataset. See task_gov_04 in docs/roadmap/gov-01-precedencia-prompts-y-rigor.md."
            fi
          fi

      # No provider secret: validate the harness invocation without an LLM
      # call. --dry-run resolves the (operator-configurable) regression
      # threshold and the agent/dataset/baseline args, then exits 0.
      #
      # Los valores son PLACEHOLDERS con nombre, no UUIDs todo-ceros: un
      # 00000000-... se lee como un id real y hace pensar que el gate corrio
      # contra algo. Aqui no se evalua nada, y el argumento solo tiene que
      # existir para que el arg-parse se ejercite.
      - name: Eval gate (dry-run, no provider secret or no eval config)
        if: steps.provider.outputs.has_provider == 'false'
        env:
          # Operator-configurable tunable — never a hard-coded magic number.
          EVAL_REGRESSION_THRESHOLD: ${{ vars.EVAL_REGRESSION_THRESHOLD }}
        run: |
          python -m api_server.evals.ci_run \
            --agent "dry-run-placeholder-agent" \
            --dataset "dry-run-placeholder-dataset" \
            --baseline-run "dry-run-placeholder-baseline-run" \
            --dry-run

      # Secreto Y configuracion presentes: corre el harness vivo + el merge-gate.
      # Tres salidas posibles, y las tres significan algo distinto:
      #
      #   0 - se midio y no hay regresion mas alla del umbral: se puede mergear.
      #   1 - se midio y HAY regresion: falla el job y bloquea el merge
      #       (task_14_08).
      #   2 - INCONCLUSIVE: no se pudo medir (hoy, porque no hay productor de
      #       diff vivo cableado). No-cero a proposito: un gate que no comprobo
      #       nada no puede salir en verde. NO se arregla poniendo --dry-run
      #       aqui; se arregla cableando el productor.
      #
      # Las tres variables van SIN default `:-`: si falta configuracion la CLI
      # rechaza el valor en blanco y lo dice, en vez de evaluar un agente
      # inventado. (Este paso solo corre si el paso de deteccion ya comprobo que
      # estan definidas, asi que un blanco aqui seria un bug del workflow.)
      - name: Eval gate (live harness + merge-gate)
        if: steps.provider.outputs.has_provider == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          COPILOT_OAUTH_TOKEN: ${{ secrets.COPILOT_OAUTH_TOKEN }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          EVAL_REGRESSION_THRESHOLD: ${{ vars.EVAL_REGRESSION_THRESHOLD }}
          EVAL_SUBJECT_AGENT: ${{ vars.EVAL_SUBJECT_AGENT }}
          EVAL_GOLDEN_DATASET: ${{ vars.EVAL_GOLDEN_DATASET }}
          EVAL_BASELINE_RUN: ${{ vars.EVAL_BASELINE_RUN }}
        run: |
          python -m api_server.evals.ci_run \
            --agent "${EVAL_SUBJECT_AGENT}" \
            --dataset "${EVAL_GOLDEN_DATASET}" \
            --baseline-run "${EVAL_BASELINE_RUN}"
