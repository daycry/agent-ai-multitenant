name: Build runtime templates

# Plan 06 task_06_03 — construir las catorce imágenes de test-runtime.
#
# ADR 0148 (firmado el 2026-08-01) — este workflow dejó de tirar a la basura lo
# que construye. Antes usaba `push: false` + `load: true`: CI demostraba que el
# Dockerfile compila y **cada host se construía su propia variante** de las 14
# imágenes donde el Principio Rector 2 deposita el aislamiento del código NO
# confiable. Dos instalaciones del mismo commit ejecutaban cosas distintas y el
# sistema no podía responder «¿qué imagen exacta ejecutó el código de este
# tenant?».
#
# Ahora, en `master` (y en `workflow_dispatch`), las catorce se PUBLICAN en
# ghcr.io/${{ github.repository_owner }}/agent-runtime-<slug>:<version> y un job final resuelve
# sus digests y abre un PR contra el manifiesto que lee el catálogo
# (`packages/shared-test-runtimes/src/shared_test_runtimes/runtime_images.json`).
# En pull_request y en ramas `plan/**` nada se publica: se construye en local y
# se escanea, que es el gate de siempre.

on:
  push:
    branches: [master, "plan/**"]
    paths:
      - "docker/agent-runtimes/**"
      - "packages/shared-test-runtimes/**"
      # …menos el manifiesto que este mismo workflow escribe. Sin esta
      # exclusión, mergear su PR de digests dispara otra publicación, que
      # resuelve digests, que abre otro PR: un bucle que se alimenta solo.
      - "!packages/shared-test-runtimes/src/shared_test_runtimes/runtime_images.json"
      - ".github/workflows/build-runtime-templates.yml"
  pull_request:
    branches: [master]
    paths:
      - "docker/agent-runtimes/**"
      - "packages/shared-test-runtimes/**"
      # …menos el manifiesto que este mismo workflow escribe. Sin esta
      # exclusión, mergear su PR de digests dispara otra publicación, que
      # resuelve digests, que abre otro PR: un bucle que se alimenta solo.
      - "!packages/shared-test-runtimes/src/shared_test_runtimes/runtime_images.json"
      - ".github/workflows/build-runtime-templates.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ¿Esta ejecución publica? Se resuelve UNA vez y los demás jobs la heredan:
  # repetir la condición en cada `if:` es como se acaba publicando desde una
  # rama de trabajo sin que nadie lo note.
  prep:
    name: Resolve publish mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] \
             || { [ "${{ github.ref }}" != "refs/heads/master" ] \
                  && [ "${{ github.event_name }}" != "workflow_dispatch" ]; }; then
            publish=false
          else
            publish=true
          fi
          # La versión sale del propio manifiesto: el tag que se publica y el que
          # el catálogo compone son EL MISMO por construcción, no por disciplina.
          version=$(python3 -c "import json;print(json.load(open('packages/shared-test-runtimes/src/shared_test_runtimes/runtime_images.json'))['version'])")
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish version=$version"

  build:
    name: Build ${{ matrix.template }}
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Don't stop the other thirteen if one fails — we want the full
      # signal of which templates are broken, not the first one.
      fail-fast: false
      matrix:
        # Keep this list in sync with shared_test_runtimes.catalog and
        # the EXPECTED_TEMPLATES set in tests/unit/test_runtime_catalog.py.
        template:
          - python-pytest
          - node-jest
          - node-vitest
          - node-playwright
          - php-phpunit
          - php-pest
          - go-test
          - java-maven
          - java-gradle
          - ruby-rspec
          - rust-cargo
          - dotnet-test
          - generic-shell
          - generic-http
    env:
      # Referencia con la que trabajan Trivy y el smoke: la publicada cuando esta
      # ejecución publica, la local cuando no. Una sola variable para que los dos
      # pasos no puedan mirar imágenes distintas.
      #
      # El dueño entra como ARGUMENTO de `format`, no interpolado en la cadena.
      # Un `'ghcr.io/${{ github.repository_owner }}'` aquí NO es una expresión:
      # está dentro de un `${{ }}` ya abierto, así que es texto literal y viaja
      # tal cual al tag (`invalid reference format`, las 14 en rojo el
      # 2026-08-21). actionlint no lo caza porque la sintaxis es válida; el
      # error es semántico. Tampoco vale `env.REGISTRY`: el contexto `env` no
      # está disponible en un `env:` de nivel job. `github` sí.
      IMAGE_REF: ${{ needs.prep.outputs.publish == 'true' && format('ghcr.io/{0}/agent-runtime-{1}:{2}', github.repository_owner, matrix.template, needs.prep.outputs.version) || format('agent-runtime-{0}:{1}', matrix.template, needs.prep.outputs.version) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: needs.prep.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker/agent-runtimes/${{ matrix.template }}
          file: docker/agent-runtimes/${{ matrix.template }}/Dockerfile
          # Publicar y cargar en el daemon local son exportadores distintos: se
          # elige uno según el modo, y los pasos de abajo usan `IMAGE_REF`, que
          # apunta a la que exista.
          push: ${{ needs.prep.outputs.publish == 'true' }}
          load: ${{ needs.prep.outputs.publish != 'true' }}
          # Al publicar van dos tags: el versionado (legible, y el que Dependabot
          # sabe leer) y el del commit (inmutable de verdad). Quien resuelve, en
          # cualquier caso, es el digest que este workflow escribe en el catálogo.
          tags: ${{ needs.prep.outputs.publish == 'true' && format('{0},{1}/agent-runtime-{2}:{3}', env.IMAGE_REF, env.REGISTRY, matrix.template, github.sha) || env.IMAGE_REF }}
          # GitHub Actions cache backend: each template caches its own
          # layers under a key derived from the matrix value.
          cache-from: type=gha,scope=runtime-${{ matrix.template }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.template }}
          # La etapa `runtime` NO se cachea, y no es una precaucion teorica.
          # El 2026-08-18 cuatro templates cayeron con CVE-2026-53615 (familia
          # util-linux, fix ya publicado en `trixie-security`). `rust-cargo`
          # llevaba su `apt-get -y upgrade` desde hacia semanas y aun asi
          # entrego los paquetes viejos: el log dice
          # `#12 [2/5] RUN apt-get update && apt-get -y upgrade` -> `CACHED`.
          # Una capa que dice parchear y se sirve del cache es una medida que
          # miente, y encima la unica que protege las imagenes donde corre el
          # codigo NO confiable (Principio Rector 2).
          #
          # El coste es reconstruir la etapa final en cada build; las etapas
          # `builder` (compilaciones caras) siguen cacheadas. Es el precio de
          # que el parche sea real.
          # Ver docs/03-guides/gotchas/trivy-en-rojo-tres-causas-distintas.md
          no-cache-filters: runtime

      # Trivy sobre CADA template de la matriz (prod-11 task_trivy_07, gap5-1).
      #
      # Estas son las imágenes donde el Principio Rector 2 deposita el
      # aislamiento del código NO confiable: es donde una CVE de la base importa
      # más y donde hasta ahora la ÚNICA verificación era el smoke de WORKDIR de
      # abajo (que se conserva, pero deja de ser el único gate).
      #
      # `ignore-unfixed: true`: las bases `-slim`/`alpine` acumulan CVEs sin fix
      # upstream; sin esto el gate bloquearía PRs ajenos al problema (riesgo 2).
      # Las excepciones CON fix van a `.trivyignore`, con justificación y fecha
      # de revisión obligatorias.
      #
      # TRADE-OFF declarado, igual que en `release-images.yml`: cuando se publica,
      # el escaneo va DESPUÉS del push. Lo que sí garantiza este orden es lo que
      # de verdad importa: `refresh-digests` depende de que los catorce jobs
      # terminen en verde, así que **una imagen con una CVE HIGH/CRITICAL nunca
      # llega al catálogo**, por mucho que su blob esté en el registry.
      - name: Trivy — ${{ matrix.template }} (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          cache: true

      - name: Image smoke (the catalog claims WORKDIR=/workspace)
        run: |
          docker run --rm --entrypoint pwd "${IMAGE_REF}" | tee /tmp/pwd.txt
          test "$(cat /tmp/pwd.txt)" = "/workspace"

  # ADR 0148, condición 1: «nada de digest sin vía de refresco». ESTE job es la
  # vía. El digest del catálogo no lo teclea nadie: se resuelve contra el
  # registry después de que las catorce hayan pasado Trivy, y llega al repo por
  # PR — revisable, y sin permiso de escritura directa sobre `master`.
  #
  # AJUSTE DEL REPOSITORIO QUE ESTE JOB NECESITA, y que no se deduce de aquí:
  # Settings -> Actions -> General -> Workflow permissions -> «Allow GitHub
  # Actions to create and approve pull requests». Sin esa casilla el job hace
  # TODO su trabajo —resuelve los catorce digests y empuja la rama— y muere en
  # la última línea con:
  #
  #   GraphQL: GitHub Actions is not permitted to create or approve pull requests
  #
  # Pasó en la primera publicación real, el 2026-08-21: el rojo no señalaba nada
  # roto y la rama con el manifiesto ya estaba en origin (se abrió el PR #84 a
  # mano). El operador activó la casilla ese mismo día, dejando
  # `default_workflow_permissions` en `read`: lo que se concede es abrir PRs, no
  # escritura general con el token. Si algún día se revoca, este job volverá a
  # morir así, y el arreglo es la casilla, no el workflow.
  refresh-digests:
    name: Refresh catalog digests
    needs: [prep, build]
    if: ${{ needs.prep.outputs.publish == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the published digests
        id: digests
        env:
          VERSION: ${{ needs.prep.outputs.version }}
          # El paquete no tiene dependencias: basta el PYTHONPATH. Un `pip
          # install` aquí chocaría con el entorno gestionado del runner (PEP 668)
          # por nada.
          PYTHONPATH: packages/shared-test-runtimes/src
        run: |
          set -euo pipefail
          # La lista de plantillas sale del CATÁLOGO, no de una copia en este
          # fichero: una plantilla nueva entra en el manifiesto sin que nadie se
          # acuerde de tocar el workflow.
          templates=$(python3 -c "from shared_test_runtimes.catalog import list_ids; print('\n'.join(list_ids()))")
          args=()
          for t in $templates; do
            ref="${REGISTRY}/agent-runtime-${t}:${VERSION}"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            echo "$t -> $digest"
            args+=(--digest "${t}=${digest}")
          done
          python3 -m shared_test_runtimes.release \
            --registry "${REGISTRY}" --version "${VERSION}" "${args[@]}"

      - name: Open a PR when the manifest moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          set -euo pipefail
          manifest=packages/shared-test-runtimes/src/shared_test_runtimes/runtime_images.json
          if git diff --quiet -- "$manifest"; then
            echo "El manifiesto no ha cambiado: nada que proponer."
            exit 0
          fi
          branch="chore/runtime-digests-${GITHUB_SHA::12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$manifest"
          git commit -m "chore(runtimes): refresca los digests publicados (${VERSION})" \
                     -m "Generado por build-runtime-templates.yml sobre ${GITHUB_SHA}. ADR 0148."
          git push origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore(runtimes): digests de las imágenes de runtime (${VERSION})" \
            --body "Digests resueltos contra \`${REGISTRY}\` tras publicar las 14 imágenes y pasar Trivy. Los escribe el pipeline: editarlos a mano congelaría sus CVEs (ADR 0148, condición 1)."

  # Final aggregator job so branch protection can require a single
  # check ("Build runtime templates / summary") instead of fourteen.
  summary:
    name: summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: always()
    steps:
      - name: Aggregate
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "All 14 runtime templates built successfully."
          else
            echo "At least one runtime template build failed: ${{ needs.build.result }}"
            exit 1
          fi
