name: Build runtime templates

# Plan 06 task_06_03 — build the fourteen curated test-runtime images
# in a matrix on every change to their Dockerfiles or to the catalog
# package. Push to a registry is deferred (we tag locally only) — the
# CI signal here is "does the Dockerfile build at all on a fresh
# Ubuntu runner". When the platform later picks a registry, replace
# the docker/build-push-action step's ``push: false`` and add a login
# step; nothing else needs to change.

on:
  push:
    branches: [master, "plan/**"]
    paths:
      - "docker/agent-runtimes/**"
      - "packages/shared-test-runtimes/**"
      - ".github/workflows/build-runtime-templates.yml"
  pull_request:
    branches: [master]
    paths:
      - "docker/agent-runtimes/**"
      - "packages/shared-test-runtimes/**"
      - ".github/workflows/build-runtime-templates.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.template }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Don't stop the other thirteen if one fails — we want the full
      # signal of which templates are broken, not the first one.
      fail-fast: false
      matrix:
        # Keep this list in sync with shared_test_runtimes.catalog and
        # the EXPECTED_TEMPLATES set in tests/unit/test_runtime_catalog.py.
        template:
          - python-pytest
          - node-jest
          - node-vitest
          - node-playwright
          - php-phpunit
          - php-pest
          - go-test
          - java-maven
          - java-gradle
          - ruby-rspec
          - rust-cargo
          - dotnet-test
          - generic-shell
          - generic-http
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker/agent-runtimes/${{ matrix.template }}
          file: docker/agent-runtimes/${{ matrix.template }}/Dockerfile
          push: false
          load: true
          tags: agent-runtime-${{ matrix.template }}:v1
          # GitHub Actions cache backend: each template caches its own
          # layers under a key derived from the matrix value.
          cache-from: type=gha,scope=runtime-${{ matrix.template }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.template }}

      # Trivy sobre CADA template de la matriz (prod-11 task_trivy_07, gap5-1).
      #
      # Estas son las imágenes donde el Principio Rector 2 deposita el
      # aislamiento del código NO confiable: es donde una CVE de la base importa
      # más y donde hasta ahora la ÚNICA verificación era el smoke de WORKDIR de
      # abajo (que se conserva, pero deja de ser el único gate).
      #
      # `ignore-unfixed: true`: las bases `-slim`/`alpine` acumulan CVEs sin fix
      # upstream; sin esto el gate bloquearía PRs ajenos al problema (riesgo 2).
      # Las excepciones CON fix van a `.trivyignore`, con justificación y fecha
      # de revisión obligatorias.
      - name: Trivy — ${{ matrix.template }} (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: agent-runtime-${{ matrix.template }}:v1
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          cache: true

      - name: Image smoke (the catalog claims WORKDIR=/workspace)
        run: |
          docker run --rm --entrypoint pwd agent-runtime-${{ matrix.template }}:v1 \
            | tee /tmp/pwd.txt
          test "$(cat /tmp/pwd.txt)" = "/workspace"

  # Final aggregator job so branch protection can require a single
  # check ("Build runtime templates / summary") instead of fourteen.
  summary:
    name: summary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: always()
    steps:
      - name: Aggregate
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "All 14 runtime templates built successfully."
          else
            echo "At least one runtime template build failed: ${{ needs.build.result }}"
            exit 1
          fi
