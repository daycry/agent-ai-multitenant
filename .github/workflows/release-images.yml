name: Release images

# Plan prod-01 task_03 (finding deploy-2 / quality-2): build & push the five
# application images the installer's compose references
# (ghcr.io/${{ github.repository_owner }}/<app>:<tag>, see compose_generator.APP_IMAGE_*).
# They did not exist and there was no pipeline to publish them.
#
# Triggered by a release tag (v*) or manual dispatch — NOT on every push (that
# is ci.yml's gate). api-server is the heavy BASE image (shared-* + native
# xmlsec); workers/orchestrator/notification-dispatcher reuse it via BASE_IMAGE,
# so they must build AFTER it (the `needs:` chain enforces the order task_01
# documented). admin-panel is independent.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the git ref name)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  prep:
    name: Resolve image tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing tag: $tag"

  api-server:
    name: Build & push api-server (base)
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push api-server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api-server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/api-server:${{ needs.prep.outputs.tag }}
            ${{ env.REGISTRY }}/api-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy sobre la imagen publicada (prod-11 task_trivy_07).
      #
      # TRADE-OFF declarado: el escaneo va DESPUÉS del push, no antes. Hacerlo
      # antes obligaría a partir el paso en build+load → scan → push, y esta
      # tubería de release no se puede validar hoy (CI caído por facturación),
      # así que se prefirió el cambio de menor riesgo. Lo que SÍ garantiza este
      # orden: el job queda en rojo —la release entera se marca fallida— y el
      # `needs: api-server` impide que se publiquen los tres backends que
      # heredan esta base. Convertirlo en gate previo al push es follow-up.
      - name: Trivy — api-server publicada (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/api-server:${{ needs.prep.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          cache: true

  backend:
    name: Build & push ${{ matrix.app }}
    needs: [prep, api-server]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # Toda app cuyo Dockerfile lleva `ARG BASE_IMAGE` va aquí, y una guarda
        # lo comprueba contra el árbol (tests/unit/test_app_images_are_built_by_ci.py):
        # `watchdog` entró el 2026-08-02 y esta matriz siguió diciendo tres, así
        # que su imagen no se publicaba en ningún sitio mientras el compose
        # canónico ya la pedía por `${IMAGE_WATCHDOG}`. Un servicio declarado sin
        # imagen publicada no es un servicio: es un `up` que falla en el host de
        # otro.
        app: [workers, orchestrator, notification-dispatcher, watchdog]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push ${{ matrix.app }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/api-server:${{ needs.prep.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.app }}:${{ needs.prep.outputs.tag }}
            ${{ env.REGISTRY }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — ${{ matrix.app }} publicada (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ matrix.app }}:${{ needs.prep.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          cache: true

  admin-panel:
    name: Build & push admin-panel
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push admin-panel
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/admin-panel
          file: apps/admin-panel/Dockerfile
          push: true
          # Bake the single-origin API prefix (ADR 0061): the published image
          # talks to the backend at the same origin under /api, behind the TLS
          # reverse proxy. The prefix is domain-independent so it CAN be baked
          # here; the remaining same-origin JS fixes (wsUrl, review page) are
          # prod-09 (frontend-8).
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ env.REGISTRY }}/admin-panel:${{ needs.prep.outputs.tag }}
            ${{ env.REGISTRY }}/admin-panel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — admin-panel publicada (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/admin-panel:${{ needs.prep.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          cache: true
