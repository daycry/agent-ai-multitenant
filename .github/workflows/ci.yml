name: CI

on:
  push:
    branches: [main, "plan/**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same workflow on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Python lint: black + ruff + mypy via pre-commit so versions stay in
  # lockstep with .pre-commit-config.yaml — never the surprise of
  # "passes locally on black 24.10, fails on CI on black 25.x".
  # ---------------------------------------------------------------------------
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project (editable) so mypy resolves api_server / watchdog
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps/api-server[dev]"
          python -m pip install -e "apps/watchdog[dev]"
          python -m pip install -e "apps/orchestrator[dev]"
          python -m pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  # ---------------------------------------------------------------------------
  # TypeScript lint: prettier + eslint via the admin-panel package itself.
  # ---------------------------------------------------------------------------
  lint-typescript:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect Node workspace
        id: detect
        run: |
          if [ -f apps/admin-panel/package.json ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
            echo "No apps/admin-panel/package.json yet — skipping TS lint."
          fi

      - uses: actions/setup-node@v5
        if: steps.detect.outputs.has_node == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin-panel/package-lock.json

      - name: npm ci
        if: steps.detect.outputs.has_node == 'true'
        working-directory: apps/admin-panel
        run: npm ci

      - name: typecheck
        if: steps.detect.outputs.has_node == 'true'
        working-directory: apps/admin-panel
        run: npm run typecheck

      - name: next lint
        if: steps.detect.outputs.has_node == 'true'
        working-directory: apps/admin-panel
        run: npm run lint

      - name: next build (smoke)
        if: steps.detect.outputs.has_node == 'true'
        working-directory: apps/admin-panel
        run: npm run build

  # ---------------------------------------------------------------------------
  # Python unit tests. Need the local editable installs so the imports
  # `from api_server.* import ...` and `from watchdog.* import ...` work.
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Detect unit tests
        id: detect
        run: |
          if find tests/unit -type f -name "test_*.py" 2>/dev/null | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No unit tests yet — skipping."
          fi

      - name: Install project (editable) + test deps
        if: steps.detect.outputs.has_tests == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps/api-server[dev]"
          python -m pip install -e "apps/watchdog[dev]"
          python -m pip install -e "apps/orchestrator[dev]"

      - name: pytest tests/unit
        if: steps.detect.outputs.has_tests == 'true'
        run: pytest tests/unit -v

  # ---------------------------------------------------------------------------
  # Integration tests against docker-compose. Brings up the stack and
  # runs the tenant/auth/admin/tracing tests against real Postgres + Redis.
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect compose file
        id: detect
        run: |
          if [ -f docker/docker-compose.yml ]; then
            echo "has_compose=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_compose=false" >> "$GITHUB_OUTPUT"
            echo "No docker/docker-compose.yml yet — skipping."
          fi

      - uses: actions/setup-python@v6
        if: steps.detect.outputs.has_compose == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: docker compose config
        if: steps.detect.outputs.has_compose == 'true'
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml config

      - name: Bring up test stack
        if: steps.detect.outputs.has_compose == 'true'
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up -d --wait postgres redis vault minio

      - name: Install project (editable) + test deps
        if: steps.detect.outputs.has_compose == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps/api-server[dev]"
          python -m pip install -e "apps/watchdog[dev]"
          python -m pip install -e "apps/orchestrator[dev]"

      - name: pytest tests/integration
        if: steps.detect.outputs.has_compose == 'true'
        env:
          # In GH Actions there is no Laragon — bind the docker container
          # to the standard port for ergonomic conftest defaults.
          TEST_PG_PORT: "15432"
          TEST_REDIS_URL: redis://localhost:6379/15
        run: |
          if find tests/integration -type f -name "test_*.py" | grep -q .; then
            pytest tests/integration -v
          else
            echo "No integration tests yet."
          fi

      - name: Stack logs on failure
        if: failure() && steps.detect.outputs.has_compose == 'true'
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml logs --tail=200

      - name: Tear down
        if: always() && steps.detect.outputs.has_compose == 'true'
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml down -v

  # ---------------------------------------------------------------------------
  # Docker image build smoke test (per app with a Dockerfile).
  # ---------------------------------------------------------------------------
  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect Dockerfiles
        id: detect
        run: |
          mapfile -t files < <(find apps -name Dockerfile 2>/dev/null)
          if [ ${#files[@]} -gt 0 ]; then
            echo "has_dockerfiles=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${files[@]}"
          else
            echo "has_dockerfiles=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfiles yet — skipping."
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.detect.outputs.has_dockerfiles == 'true'

      - name: Build each app
        if: steps.detect.outputs.has_dockerfiles == 'true'
        run: |
          for f in $(find apps -name Dockerfile); do
            app_dir="$(dirname "$f")"
            app_name="$(basename "$app_dir")"
            echo "::group::Building $app_name"
            docker buildx build --load -t "agentic-platform/$app_name:ci" "$app_dir"
            echo "::endgroup::"
          done
