name: CI

on:
  push:
    branches: [main, "plan/**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same workflow on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Python lint: black, ruff, mypy (strict). No-op when no .py exists yet.
  # ---------------------------------------------------------------------------
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Detect Python sources
        id: detect
        run: |
          if find apps packages tests -type f -name "*.py" 2>/dev/null | grep -q .; then
            echo "has_py=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_py=false" >> "$GITHUB_OUTPUT"
            echo "No Python sources yet — skipping lint."
          fi

      - name: Install lint tools
        if: steps.detect.outputs.has_py == 'true'
        run: python -m pip install --upgrade pip black ruff mypy

      - name: black --check
        if: steps.detect.outputs.has_py == 'true'
        run: black --check .

      - name: ruff check
        if: steps.detect.outputs.has_py == 'true'
        run: ruff check .

      - name: mypy (apps + packages)
        if: steps.detect.outputs.has_py == 'true'
        run: mypy apps packages

  # ---------------------------------------------------------------------------
  # TypeScript lint: prettier + eslint. No-op until a package.json exists.
  # ---------------------------------------------------------------------------
  lint-typescript:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Node workspace
        id: detect
        run: |
          if find apps packages -name "package.json" 2>/dev/null | grep -q .; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet — skipping TS lint."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_node == 'true'
        with:
          node-version: "20"
          cache: npm

      - name: Install root devDeps
        if: steps.detect.outputs.has_node == 'true'
        run: npm install --no-save prettier eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin

      - name: prettier --check
        if: steps.detect.outputs.has_node == 'true'
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,json,md,yml,yaml}"

      - name: eslint
        if: steps.detect.outputs.has_node == 'true'
        run: npx eslint . --ext .ts,.tsx,.js,.jsx

  # ---------------------------------------------------------------------------
  # Python unit tests. No-op until tests exist.
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Detect unit tests
        id: detect
        run: |
          if find tests/unit -type f -name "test_*.py" 2>/dev/null | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No unit tests yet — skipping."
          fi

      - name: Install test deps
        if: steps.detect.outputs.has_tests == 'true'
        run: python -m pip install --upgrade pip pytest

      - name: pytest tests/unit
        if: steps.detect.outputs.has_tests == 'true'
        run: pytest tests/unit -v

  # ---------------------------------------------------------------------------
  # Integration tests against docker-compose. No-op until docker-compose.yml
  # exists (task_00_04).
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect compose file
        id: detect
        run: |
          if [ -f docker/docker-compose.yml ]; then
            echo "has_compose=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_compose=false" >> "$GITHUB_OUTPUT"
            echo "No docker/docker-compose.yml yet — skipping."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.has_compose == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: docker compose config
        if: steps.detect.outputs.has_compose == 'true'
        run: docker compose -f docker/docker-compose.yml config

      - name: Bring up test stack
        if: steps.detect.outputs.has_compose == 'true'
        run: docker compose -f docker/docker-compose.yml up -d --wait

      - name: Install + run integration tests
        if: steps.detect.outputs.has_compose == 'true'
        run: |
          python -m pip install --upgrade pip pytest
          if find tests/integration -type f -name "test_*.py" | grep -q .; then
            pytest tests/integration -v
          else
            echo "No integration tests yet."
          fi

      - name: Tear down
        if: always() && steps.detect.outputs.has_compose == 'true'
        run: docker compose -f docker/docker-compose.yml down -v

  # ---------------------------------------------------------------------------
  # Docker image build smoke test (per app with a Dockerfile).
  # ---------------------------------------------------------------------------
  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Dockerfiles
        id: detect
        run: |
          mapfile -t files < <(find apps -name Dockerfile 2>/dev/null)
          if [ ${#files[@]} -gt 0 ]; then
            echo "has_dockerfiles=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${files[@]}"
          else
            echo "has_dockerfiles=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfiles yet — skipping."
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.detect.outputs.has_dockerfiles == 'true'

      - name: Build each app
        if: steps.detect.outputs.has_dockerfiles == 'true'
        run: |
          for f in $(find apps -name Dockerfile); do
            app_dir="$(dirname "$f")"
            app_name="$(basename "$app_dir")"
            echo "::group::Building $app_name"
            docker buildx build --load -t "agentic-platform/$app_name:ci" "$app_dir"
            echo "::endgroup::"
          done
