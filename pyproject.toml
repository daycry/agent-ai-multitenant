[project]
name = "agentic-platform"
version = "0.0.0"
description = "Multi-tenant agentic AI platform — see CLAUDE.md and docs/roadmap/."
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    \.venv
  | \.git
  | build
  | dist
  | node_modules
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".venv",
  "build",
  "dist",
  "node_modules",
  # Reference designs the user provided as input to ADR 0021. Kept in
  # the repo for traceability but not part of the codebase.
  "docs/provider-example",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "ARG",  # flake8-unused-arguments
  "PL",   # pylint
  "RUF",  # ruff-specific
]
ignore = [
  "PLR0913",  # too many arguments — handled case by case
  "PLR2004",  # magic value — common in tests
]

[tool.ruff.lint.per-file-ignores]
# Tests often pull deps lazily and use ambiguous unicode in
# comments (e.g. `×` for multiplication, currency glyphs) — that's
# fine here.
"tests/**/*.py" = ["ARG", "PLR2004", "S101", "PLC0415", "RUF002", "RUF003", "N802"]
"packages/*/tests/**/*.py" = [
  "ARG",
  "PLR2004",
  "S101",
  "PLC0415",
  "RUF002",
  "RUF003",
  "N802",
]
# Process entry points use lazy imports inside `main()` so logging
# is configured before the app builds. Intentional, not a smell.
"apps/orchestrator/src/orchestrator/__main__.py" = ["PLC0415"]
"apps/watchdog/src/watchdog/__main__.py" = ["PLC0415"]
# The Claude Agent SDK is an optional extra of `shared-llm`. Loading
# it at module import time would force every deployment that doesn't
# use Claude to carry the SDK + its Node CLI.
"packages/shared-llm/src/shared_llm/providers/claude_agent.py" = ["PLC0415"]
# `BGEReranker` lazy-imports `FlagEmbedding` (torch + transformers)
# so a deployment that doesn't use it pays no import cost — same
# pattern as claude_agent above.
"apps/api-server/src/api_server/rag/reranker.py" = ["PLC0415"]
# Demo scripts: long linear flows with lazy imports + Protocol-shaped
# fakes whose method signatures must match the LLMProvider Protocol
# (so `messages`/`kwargs` look "unused" to ruff).
"scripts/demo_*.py" = ["PLR0915", "PLC0415", "ARG002", "ARG003"]
"scripts/setup_demo_*.py" = ["PLR0915", "PLC0415", "E501", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection helpers are the canonical way to declare
# dependencies on routes — calling them in argument defaults is correct
# and idiomatic, not a B008 violation.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Query",
  "fastapi.Body",
  "fastapi.Path",
  "fastapi.Form",
  "fastapi.Cookie",
  "fastapi.File",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
  "^\\.venv/",
  "^build/",
  "^dist/",
  "^node_modules/",
]

# Celery and kombu ship no py.typed marker; treat their imports as
# untyped rather than vendoring stub packages into the hook. Same for
# LangGraph — the planning sub-graph imports `langgraph.graph` but the
# package has no py.typed marker either.
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "langgraph.*"]
ignore_missing_imports = true

# The Docker SDK's inline types are incomplete (docker.from_env and
# docker.errors are not visible to mypy). Skip following it entirely —
# the worker deliberately treats the Docker client as Any.
[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true
follow_imports = "skip"

# The Claude Agent SDK is an optional dependency of agent-runtime
# (provider=claude only) — lazily imported, not installed in the hook
# venv. Treat its imports as untyped rather than vendoring stubs.
[[tool.mypy.overrides]]
module = ["claude_agent_sdk", "claude_agent_sdk.*"]
ignore_missing_imports = true

# `python-jose` ships without type stubs. We only use a narrow surface
# (jwt.encode / jwt.decode / JWTError) so adopting types-python-jose
# would add weight without buying much.
[[tool.mypy.overrides]]
module = ["jose", "jose.*"]
ignore_missing_imports = true

# `pgvector` (>=0.3) ships .pyi stubs for the asyncpg/numpy adapters
# but not for `pgvector.sqlalchemy.Vector`; treat the whole module as
# untyped rather than vendoring our own stubs (Plan 04).
[[tool.mypy.overrides]]
module = ["pgvector", "pgvector.*"]
ignore_missing_imports = true

# `shared-llm` is a local path package (packages/shared-llm) installed
# editable in dev / CI. The pre-commit hook env doesn't install it, so
# mypy can't resolve the import — treat it as untyped here. The hook
# already trusts pgvector/jose/etc. the same way (ADR 0021).
[[tool.mypy.overrides]]
module = ["shared_llm", "shared_llm.*"]
ignore_missing_imports = true

# `minio` Python client ships partial type info: `minio.error` has no
# stubs in the published wheel. Treat the whole package as untyped —
# we only touch a handful of methods (put_object, get_object,
# remove_object, stat_object, bucket_exists, make_bucket).
[[tool.mypy.overrides]]
module = ["minio", "minio.*"]
ignore_missing_imports = true

# `FlagEmbedding` (used by BGEReranker, Plan 04 task_04_19) is heavy
# (torch + transformers). Optional dep — lazy-imported only when the
# real reranker is actually wired. Mypy can't see it in the hook env.
[[tool.mypy.overrides]]
module = ["FlagEmbedding", "FlagEmbedding.*"]
ignore_missing_imports = true

# Official `mcp` SDK from Anthropic (Plan 05 task_05_01) — used
# inside packages/shared-mcp/. Same pattern as shared_llm: the
# pre-commit mypy venv doesn't have it, but the runtime venv does.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "shared_mcp", "shared_mcp.*"]
ignore_missing_imports = true

# `shared-test-runtimes` is a local path package (Plan 06 task_06_01).
# Same pattern as shared_mcp / shared_llm: pre-commit mypy hook doesn't
# install it; the runtime venv does.
[[tool.mypy.overrides]]
module = ["shared_test_runtimes", "shared_test_runtimes.*"]
ignore_missing_imports = true

# Cross-app imports (Plan 06 task_06_H / orchestrator.plan_runner).
# The orchestrator imports from api_server.* and workers.* directly to
# stitch the modules into a sync demo runner. Same story: pre-commit
# venv lacks them, runtime venv has them but without py.typed marker.
[[tool.mypy.overrides]]
module = [
    "api_server.plan_progress",
    "api_server.task_lifecycle",
    "api_server.db.review_session_repo",
    "api_server.db.task_audit_repo",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["workers.git_repos", "workers.plan_git", "workers.runtime_pool", "workers.review_runtime"]
ignore_missing_imports = true

# `hvac` is the Vault client used by `routers/mcp.get_vault_resolver`
# (Plan 05 task_05_17). Same story as the rest of optional deps — the
# pre-commit mypy hook doesn't install it; the runtime venv does.
[[tool.mypy.overrides]]
module = ["hvac", "hvac.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Need the repo root on sys.path so `from tests.integration._git_helpers
# import ...` resolves. Pytest invoked as `pytest ...` (the bin script,
# not `python -m pytest`) doesn't add CWD to sys.path on Python 3.11+,
# so CI failed with `ModuleNotFoundError: No module named 'tests'`. Local
# `python -m pytest` worked because -m adds CWD.
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: unit tests (fast, no I/O)",
  "integration: integration tests (DB, Redis, Docker)",
  "e2e: end-to-end tests (full stack)",
]
