[project]
name = "agentic-platform"
version = "0.0.0"
description = "Multi-tenant agentic AI platform — see CLAUDE.md and docs/roadmap/."
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    \.venv
  | \.git
  | build
  | dist
  | node_modules
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "node_modules"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "ARG",  # flake8-unused-arguments
  "PL",   # pylint
  "RUF",  # ruff-specific
]
ignore = [
  "PLR0913",  # too many arguments — handled case by case
  "PLR2004",  # magic value — common in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "PLR2004", "S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection helpers are the canonical way to declare
# dependencies on routes — calling them in argument defaults is correct
# and idiomatic, not a B008 violation.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Query",
  "fastapi.Body",
  "fastapi.Path",
  "fastapi.Form",
  "fastapi.Cookie",
  "fastapi.File",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
  "^\\.venv/",
  "^build/",
  "^dist/",
  "^node_modules/",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: unit tests (fast, no I/O)",
  "integration: integration tests (DB, Redis, Docker)",
  "e2e: end-to-end tests (full stack)",
]
