[project]
name = "agentic-platform"
version = "0.0.0"
description = "Multi-tenant agentic AI platform — see CLAUDE.md and docs/roadmap/."
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]
# `packages/sdk-python/src/agentic_platform_sdk` is the GENERATED Python SDK
# (Plan 13 task_13_13): `models.py` is emitted by datamodel-code-generator and
# follows the generator's own style, and the thin hand-written client shares
# the dir for cohesion. Excluded from the lint gate; verified instead by
# tests/integration/test_sdk_python.py (see packages/sdk-python/README.md).
extend-exclude = '''
/(
    \.venv
  | \.git
  | build
  | dist
  | node_modules
  | packages/sdk-python/src/agentic_platform_sdk
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".venv",
  "build",
  "dist",
  "node_modules",
  # Reference designs the user provided as input to ADR 0021. Kept in
  # the repo for traceability but not part of the codebase.
  "docs/provider-example",
  # Generated Python SDK (Plan 13 task_13_13): datamodel-code-generator
  # output + a thin hand-written client. Generated style differs from the
  # repo's; verified by tests/integration/test_sdk_python.py instead.
  "packages/sdk-python/src/agentic_platform_sdk",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "ARG",  # flake8-unused-arguments
  "PL",   # pylint
  "RUF",  # ruff-specific
]
ignore = [
  "PLR0913",  # too many arguments — handled case by case
  "PLR2004",  # magic value — common in tests
]

[tool.ruff.lint.per-file-ignores]
# Tests often pull deps lazily and use ambiguous unicode in
# comments (e.g. `×` for multiplication, currency glyphs) — that's
# fine here.
"tests/**/*.py" = ["ARG", "PLR2004", "S101", "PLC0415", "RUF002", "RUF003", "N802"]
"packages/*/tests/**/*.py" = [
  "ARG",
  "PLR2004",
  "S101",
  "PLC0415",
  "RUF002",
  "RUF003",
  "N802",
]
# Process entry points use lazy imports inside `main()` so logging
# is configured before the app builds. Intentional, not a smell.
"apps/orchestrator/src/orchestrator/__main__.py" = ["PLC0415"]
"apps/watchdog/src/watchdog/__main__.py" = ["PLC0415"]
# The Claude Agent SDK is an optional extra of `shared-llm`. Loading
# it at module import time would force every deployment that doesn't
# use Claude to carry the SDK + its Node CLI.
"packages/shared-llm/src/shared_llm/providers/claude_agent.py" = ["PLC0415"]
# `BGEReranker` lazy-imports `FlagEmbedding` (torch + transformers)
# so a deployment that doesn't use it pays no import cost — same
# pattern as claude_agent above.
"apps/api-server/src/api_server/rag/reranker.py" = ["PLC0415"]
# Demo scripts: long linear flows with lazy imports + Protocol-shaped
# fakes whose method signatures must match the LLMProvider Protocol
# (so `messages`/`kwargs` look "unused" to ruff).
"scripts/demo_*.py" = ["PLR0915", "PLC0415", "ARG002", "ARG003"]
"scripts/setup_demo_*.py" = ["PLR0915", "PLC0415", "E501", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection helpers are the canonical way to declare
# dependencies on routes — calling them in argument defaults is correct
# and idiomatic, not a B008 violation.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Query",
  "fastapi.Body",
  "fastapi.Path",
  "fastapi.Form",
  "fastapi.Cookie",
  "fastapi.File",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
  "^\\.venv/",
  "^build/",
  "^dist/",
  "^node_modules/",
  # Migraciones Alembic: historia append-only con el estilo del generador —
  # fuera del gate strict (mypy-total 2026-07-08; antes las excluía el hook
  # de pre-commit por path).
  "/migrations/versions/",
  # Generated Python SDK (Plan 13 task_13_13): generated Pydantic models +
  # thin hand-written client. Excluded from the strict type gate; covered by
  # tests/integration/test_sdk_python.py (see packages/sdk-python/README.md).
  "^packages/sdk-python/src/agentic_platform_sdk/",
]

# Celery and kombu ship no py.typed marker; treat their imports as
# untyped rather than vendoring stub packages into the hook.
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

# LangGraph: the assistant + planning sub-graphs import `langgraph.graph`.
# Recent releases DO ship a py.typed marker, so a full venv lets mypy analyse
# `StateGraph.add_node`'s overloads and reject our async node callables
# (call-overload) — while the pre-commit hook venv doesn't install langgraph at
# all (it is Any there). Skip following it so BOTH environments agree on Any —
# the same treatment we give the Docker SDK — instead of per-line ignores that
# would be "unused" under warn_unused_ignores in the hook env.
[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true
follow_imports = "skip"

# The Docker SDK's inline types are incomplete (docker.from_env and
# docker.errors are not visible to mypy). Skip following it entirely —
# the worker deliberately treats the Docker client as Any.
[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true
follow_imports = "skip"

# The Claude Agent SDK is an optional dependency of agent-runtime
# (provider=claude only) — lazily imported, not installed in the hook
# venv. Treat its imports as untyped rather than vendoring stubs.
[[tool.mypy.overrides]]
module = ["claude_agent_sdk", "claude_agent_sdk.*"]
ignore_missing_imports = true

# `python-jose` ships without type stubs. We only use a narrow surface
# (jwt.encode / jwt.decode / JWTError) so adopting types-python-jose
# would add weight without buying much.
[[tool.mypy.overrides]]
module = ["jose", "jose.*"]
ignore_missing_imports = true

# `pgvector` (>=0.3) ships .pyi stubs for the asyncpg/numpy adapters
# but not for `pgvector.sqlalchemy.Vector`; treat the whole module as
# untyped rather than vendoring our own stubs (Plan 04).
[[tool.mypy.overrides]]
module = ["pgvector", "pgvector.*"]
ignore_missing_imports = true

# `shared-llm` is a local path package (packages/shared-llm) installed
# editable in dev / CI. The pre-commit hook env doesn't install it, so
# mypy can't resolve the import — treat it as untyped here. The hook
# already trusts pgvector/jose/etc. the same way (ADR 0021).
[[tool.mypy.overrides]]
module = ["shared_llm", "shared_llm.*"]
ignore_missing_imports = true

# `minio` Python client ships partial type info: `minio.error` has no
# stubs in the published wheel. Treat the whole package as untyped —
# we only touch a handful of methods (put_object, get_object,
# remove_object, stat_object, bucket_exists, make_bucket).
[[tool.mypy.overrides]]
module = ["minio", "minio.*"]
ignore_missing_imports = true

# `FlagEmbedding` (used by BGEReranker, Plan 04 task_04_19) is heavy
# (torch + transformers). Optional dep — lazy-imported only when the
# real reranker is actually wired. Mypy can't see it in the hook env.
[[tool.mypy.overrides]]
module = ["FlagEmbedding", "FlagEmbedding.*"]
ignore_missing_imports = true

# Official `mcp` SDK from Anthropic (Plan 05 task_05_01) — used
# inside packages/shared-mcp/. Same pattern as shared_llm: the
# pre-commit mypy venv doesn't have it, but the runtime venv does.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "shared_mcp", "shared_mcp.*"]
ignore_missing_imports = true

# `shared-test-runtimes` is a local path package (Plan 06 task_06_01).
# Same pattern as shared_mcp / shared_llm: pre-commit mypy hook doesn't
# install it; the runtime venv does.
[[tool.mypy.overrides]]
module = ["shared_test_runtimes", "shared_test_runtimes.*"]
ignore_missing_imports = true

# `shared-guardrails` is a local path package (Plan 11 task_11_01). Same
# pattern as shared_llm / shared_mcp / shared_test_runtimes: the
# pre-commit mypy hook venv doesn't install it; the runtime / dev venv
# does. Treat the import as untyped in the hook so consumers that import
# the engine still type-check there.
[[tool.mypy.overrides]]
module = ["shared_guardrails", "shared_guardrails.*"]
ignore_missing_imports = true

# `shared-domain` is a local path package (Plan 06.18 task_06_18_03, ADR 0048):
# the canonical tool-name source of truth. Same pattern as shared_llm /
# shared_mcp / shared_test_runtimes / shared_guardrails — the pre-commit mypy
# hook venv doesn't install it; the runtime / dev venv does.
[[tool.mypy.overrides]]
module = ["shared_domain", "shared_domain.*"]
ignore_missing_imports = true

# Cross-app imports (Plan 06 task_06_H / orchestrator.plan_runner).
# The orchestrator imports from api_server.* and workers.* directly to
# stitch the modules into a sync demo runner. Same story: pre-commit
# venv lacks them, runtime venv has them but without py.typed marker.
[[tool.mypy.overrides]]
module = [
    "api_server.plan_progress",
    "api_server.task_lifecycle",
    "api_server.db.review_session_repo",
    "api_server.db.task_audit_repo",
    # notification-dispatcher (Plan 10) imports the notification ORM lazily
    # from api_server.db.notification; the package ships no py.typed marker.
    "api_server.db.notification",
    # workers.backup_task (Plan 12) lazily imports the backup enable/cron
    # platform-setting helpers from api_server; the pre-commit mypy venv lacks
    # the api_server package. Same cross-app lazy-import story as the rest.
    "api_server.db.platform_settings",
    # packages/sdk-python/scripts/generate.py (Plan 13 task_13_13) lazily
    # imports `build_v1_openapi` to build the v1 spec in-process before code
    # generation; the pre-commit mypy venv has no api_server package. Same
    # cross-app lazy-import story as the rest.
    "api_server.routers.api_v1.openapi",
    # workers.model_resolver (ADR 0057 F1) resolves the agent's model_config
    # to an executable spec (kind + endpoint + Vault credential) before the
    # container launch; it imports the provider resolver/vault/model-name
    # helpers from api_server. Same cross-app lazy-import story as the rest.
    "api_server.assistant.model_config",
    "api_server.llm_providers.factory_resolver",
    "api_server.llm_providers.liveness",
    "api_server.llm_providers.vault",
    "api_server.routers.llm_providers",
    # workers.repo_clone / plan_pr (ADR 0072 auto-PR) + the git-identity fix
    # (audit 2026-07-03) lazily import the Project/Plan ORM and the git secret
    # path helper from api_server; the pre-commit mypy venv lacks the api_server
    # package. Same cross-app lazy-import story as the rest.
    "api_server.db.domain",
    "api_server.db.models",
    "api_server.git_integration",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "workers.git_repos",
    "workers.plan_git",
    "workers.runtime_pool",
    "workers.review_runtime",
    # backup.py / backup_restore.py (Plan 12) lazily import the backup
    # destination + encryption adapters and the per-tenant restore worker
    # from the sibling `workers` package. The pre-commit mypy venv only sees
    # PyPI deps, not the editable apps/<x>, so following these imports (e.g.
    # when main.py mounts backup_router) raised import-not-found. Same
    # cross-app lazy-import story as the modules above.
    "workers.backup_destinations",
    "workers.backup_encryption",
    "workers.restore_per_tenant",
]
ignore_missing_imports = true

# `hvac` is the Vault client used by `routers/mcp.get_vault_resolver`
# (Plan 05 task_05_17). Same story as the rest of optional deps — the
# pre-commit mypy hook doesn't install it; the runtime venv does.
[[tool.mypy.overrides]]
module = ["hvac", "hvac.*"]
ignore_missing_imports = true

# `uvicorn` is the ASGI server the temporary installer backend (Plan 15
# task_15_01) lazy-imports in its `__main__` entry point. The installer is
# bootstrap-only tooling; the pre-commit mypy hook doesn't install uvicorn
# (the runtime / installer image does). Same pattern as the other
# optional-dep overrides above.
[[tool.mypy.overrides]]
module = ["uvicorn", "uvicorn.*"]
ignore_missing_imports = true

# `yaml` (PyYAML) parses doc frontmatter in the docs language validator
# (Plan 07 task_07_04). The pre-commit mypy hook doesn't install the
# `types-PyYAML` stubs; the runtime venv has PyYAML. Same pattern as the
# other optional-dep overrides above.
[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

# `jsonschema` (Plan 11 task_11_09) backs the `output_structure` guardrail.
# It ships no `py.typed` marker, so the pre-commit mypy hook can't resolve
# its types; the runtime / dev venv installs it as a base dep of
# shared-guardrails. Same pattern as the other untyped-runtime-dep overrides.
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

# Enterprise SSO / OIDC (Plan 08 task_08_01). `authlib` and the
# `joserfc` it ships sign/verify ID tokens against the IdP JWKS;
# `cryptography.fernet` encrypts the OIDC client secret at rest. The
# pre-commit mypy hook doesn't install these; the runtime venv does.
# Same pattern as the other optional-dep overrides above.
[[tool.mypy.overrides]]
module = ["authlib", "authlib.*", "joserfc", "joserfc.*", "cryptography.*"]
ignore_missing_imports = true

# SAML 2.0 (Plan 08 task_08_04). `python3-saml` (imported as the
# `onelogin.saml2.*` package) ships no type stubs and binds the native
# xmlsec backend. The api-server imports it LAZILY inside the SAML flow
# so the app stays importable without the native libs; mypy still needs
# the missing-import suppressed. Same pattern as the other optional-dep
# overrides above.
[[tool.mypy.overrides]]
module = ["onelogin", "onelogin.*", "xmlsec", "xmlsec.*"]
ignore_missing_imports = true

# MFA TOTP (Plan 08 task_08_09). `pyotp` ships no type stubs; the
# pre-commit mypy hook doesn't install it (the runtime venv does). Same
# pattern as the other optional-dep overrides above.
[[tool.mypy.overrides]]
module = ["pyotp", "pyotp.*"]
ignore_missing_imports = true

# MFA WebAuthn / FIDO2 (Plan 08 task_08_10). `webauthn` (py_webauthn) and
# `cbor2` (used by the offline software-authenticator test fixture) ship no
# type stubs; the pre-commit mypy hook doesn't install them (the runtime
# venv does). Same pattern as the other optional-dep overrides above.
[[tool.mypy.overrides]]
module = ["webauthn", "webauthn.*", "cbor2", "cbor2.*"]
ignore_missing_imports = true

# Marketplace pre-install static analysis (Plan 09 task_09_05). `bandit`
# is imported LAZILY as an availability probe in
# `marketplace.static_analysis`; the pre-commit mypy hook doesn't install
# it (the api-server dev extra + runtime venv do). semgrep is never
# imported (only its CLI is shelled out to), so no override is needed for
# it. Same pattern as the other optional-dep overrides above.
[[tool.mypy.overrides]]
module = ["bandit", "bandit.*"]
ignore_missing_imports = true

# PII detection backend (Plan 11 task_11_04). `presidio-analyzer` (which
# pulls spaCy + an NER model) is the OPTIONAL `shared-guardrails[pii]`
# extra; the `pii` guardrail imports it LAZILY and degrades to a regex
# fallback / typed "unavailable" result when absent, so the engine stays
# importable and the pre-commit mypy hook doesn't install the heavy model.
# Same pattern as the other optional-dep overrides above.
[[tool.mypy.overrides]]
module = ["presidio_analyzer", "presidio_analyzer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Need the repo root on sys.path so `from tests.integration._git_helpers
# import ...` resolves. Pytest invoked as `pytest ...` (the bin script,
# not `python -m pytest`) doesn't add CWD to sys.path on Python 3.11+,
# so CI failed with `ModuleNotFoundError: No module named 'tests'`. Local
# `python -m pytest` worked because -m adds CWD.
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: unit tests (fast, no I/O)",
  "integration: integration tests (DB, Redis, Docker)",
  "e2e: end-to-end tests (full stack)",
  "cross_tenant: multi-tenant isolation tests — assert cross-tenant denial (CI-gated, Plan 06.14)",
  "security: security-invariant tests — assert the hardening posture holds (Plan 15 internal pentest, task_15_14)",
  "timeout: per-test wall-clock cap (pytest-timeout) — used by the heavy e2e install suite (prod-01 task_20)",
]

# Coverage gate (Plan prod-02 task_06, findings tests-5 / quality-6). Coverage is
# NOT in the default addopts: only the CI unit-test step turns it on explicitly
# (--cov=api_server --cov=workers --cov=orchestrator --cov-fail-under=N) so local
# `pytest` stays fast. The floor is a RATCHET: it starts at the value the unit
# suite actually reaches today over those packages — integration tests, not
# counted here, cover much more — and is raised over time toward the
# conventions.md target (70% global / 80% critical domain). Never lower it.
# Current floor: 31% (measured 2026-07-09/10: line+branch over the three packages
# is 31.6% across 2100+ unit tests; round-down per the ratchet rule — hallazgo #8).
# The 19% baseline from 2026-06-15 sat frozen ~11 points below reality until M9
# re-measured it and added a meta-test guard (test_unit_job_enforces_a_coverage_floor).
# integration/e2e suites cover much more but run in other jobs and are not counted.
[tool.coverage.run]
branch = true
omit = [
  "*/tests/*",
  "*/migrations/*",
  "*/__main__.py",
]

[tool.coverage.report]
precision = 1
show_missing = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]
