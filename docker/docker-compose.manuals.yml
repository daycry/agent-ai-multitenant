# =============================================================================
# Dev-only overlay: MANUALS containerized stack.
#
# Containerizes the APP tier (api-server + admin-panel + Caddy reverse proxy,
# plus orchestrator + workers for real task execution) ON TOP of the running dev
# infra (docker/docker-compose.yml + .dev.yml), so the user manuals can capture
# the REAL production-like stack reached through Caddy on a single origin
# (http://localhost:8080). This is NOT the production path — prod uses the
# installer-generated compose (apps/installer). It reuses the dev infra service
# names + dev-only credentials.
#
# Usage (same project name → joins the running networks):
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml \
#                  -f docker/docker-compose.manuals.yml up -d \
#                  api-server admin-panel caddy
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # api-server — reached internally as api-server:8000 (Caddy publishes it under
  # /api). Minimal env: the same DB/Redis/JWT wiring the proven dev runner uses
  # (scripts/dev/generate-manuals.ps1); the rest of the settings keep their
  # dev-friendly defaults.
  # ---------------------------------------------------------------------------
  api-server:
    image: agentic-platform/api-server:manuals
    environment:
      # prod-10 task_prod10_04 (secrets-3). ERA la única de las cinco imágenes
      # que ejecutan `api_server.config` sin declararla: workers, workers-aux,
      # workers-backup, orchestrator, cortex-beat y notification-dispatcher la
      # llevan desde el ADR 0136, y el api-server —el servicio cuyo prefijo ES
      # `API_SERVER_`— se quedó fuera. Con `environment` cayendo a su default y
      # el DSN apuntando a `postgres:5432`, el guard anti-defaults ya no puede
      # distinguir «esto es el portátil de alguien» de «esto es producción». Aquí
      # es dev de verdad, y ahora lo dice.
      API_SERVER_ENVIRONMENT: dev
      API_SERVER_DATABASE_URL: postgresql+asyncpg://app_user:changeme-app-dev-only@postgres:5432/agentic_platform
      API_SERVER_ADMIN_DATABASE_URL: postgresql+asyncpg://migrations_user:changeme-migrations-dev-only@postgres:5432/agentic_platform
      API_SERVER_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/0
      API_SERVER_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/1
      API_SERVER_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/2
      API_SERVER_JWT_SECRET: dev-only-jwt-secret-change-me
      # NOTIF-2: debe coincidir con el Bearer de alertmanager.yml (dev).
      API_SERVER_ALERTS_INGEST_TOKEN: dev-alerts-ingest-token
      # High limit so the Playwright manual capture is never rate-limited.
      API_SERVER_LOGIN_RATE_LIMIT_COUNT: "1000"
      API_SERVER_LOGIN_RATE_LIMIT_WINDOW_SECONDS: "60"
      API_SERVER_MINIO_URL: http://minio:9000
      API_SERVER_MINIO_ACCESS_KEY: minioadmin
      API_SERVER_MINIO_SECRET_KEY: changeme-dev-only
      # In-network URLs so the dashboard "Salud de servicios" probes all reach
      # the running infra by service name (otherwise they default to localhost
      # and report down inside the container).
      API_SERVER_VAULT_URL: http://vault:8200
      # Dev-only: token del Vault en modo -dev (docker-compose.dev.yml lo arranca
      # con `-dev-root-token-id=dev-root-token`). NO es un secreto real (ya está
      # en el overlay dev). Permite que el stack de manuales gestione proveedores
      # LLM (escribe el secreto en el mount KV `secret`). Se puede sobrescribir
      # con el env del host. OJO: NO usar el token de `vault-init-output/` — es
      # de una instancia de Vault distinta (prod) y el Vault dev lo rechaza (502).
      API_SERVER_VAULT_TOKEN: ${API_SERVER_VAULT_TOKEN:-dev-root-token}
      API_SERVER_DOCLING_SERVE_URL: http://docling-serve:5001
      API_SERVER_OLLAMA_URL: http://ollama:11434
      # Modo voz (ADR 0073): STT/TTS internos. Sin depends_on duro — descargan el
      # modelo al 1er arranque; el WS de voz es best-effort si aún no están listos.
      API_SERVER_ASSISTANT_STT_URL: http://stt:8000
      API_SERVER_ASSISTANT_TTS_URL: http://tts:8880
      # Web del córtex (ADR 0067): searxng por la red interna (directo) y el
      # egress-proxy para web_fetch/Brave. El default del setting es
      # `http://localhost:8888` (inservible dentro del contenedor); aquí se
      # apunta al servicio real del compose.
      API_SERVER_CORTEX_EGRESS_PROXY_URL: http://egress-proxy:8888
      API_SERVER_CORTEX_SEARXNG_URL: http://searxng:8080
      API_SERVER_CLAMAV_HOST: clamav
      API_SERVER_CLAMAV_PORT: "3310"
      API_SERVER_EGRESS_PROXY_HOST: egress-proxy
      API_SERVER_EGRESS_PROXY_PORT: "8888"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # The python:3.12-slim runtime has NO wget/curl, so the api-server healthcheck
    # must use python (the generated compose's wget-based check is broken the same
    # way — a prod-01 fix tracked in compose_generator).
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz',timeout=5).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [agentic-net, agentic-agents]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # admin-panel — Next.js SPA built with NEXT_PUBLIC_API_URL=/api (single-origin
  # behind Caddy). Image must be built with that build-arg (see manuals runner).
  # ---------------------------------------------------------------------------
  admin-panel:
    image: agentic-platform/admin-panel:manuals
    environment:
      NODE_ENV: production
      PLATFORM_DOMAIN: localhost
    depends_on:
      api-server: { condition: service_healthy }
    networks: [agentic-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # caddy — single-origin reverse proxy. The ONLY published port (8080).
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    ports: ["8080:8080"]
    volumes:
      - ./caddy-manuals/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api-server: { condition: service_healthy }
      admin-panel: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [agentic-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # docker-socket-proxy — pasarela de API Docker de mínimo privilegio (ADR 0060).
  # Los workers lanzan los runtimes efímeros a través de ESTO (DOCKER_HOST=
  # tcp://docker-socket-proxy:2375), nunca con el socket crudo. Red dedicada
  # agentic-docker (solo workers ↔ proxy).
  # ---------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      POST: "1"
      # EXEC=1: el worker corre comandos DENTRO de los runtime-templates que él
      # mismo lanza (TestRuntimeRunner._exec → exec_run): los checks post-hoc de
      # tests Y el puente stack_exec (ADR 0093). Con EXEC=0 todo exec_run daba
      # 403 Forbidden. Sigue siendo mínimo-privilegio: el proxy vive en la red
      # dedicada agentic-docker (solo workers↔proxy) y el agent-runtime NUNCA
      # toca el socket (principio 2). ADR 0060.
      EXEC: "1"
      VOLUMES: "0"
      SWARM: "0"
      SECRETS: "0"
      CONFIGS: "0"
      NODES: "0"
      SERVICES: "0"
      TASKS: "0"
      SYSTEM: "0"
      INFO: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [agentic-docker]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # orchestrator — asigna tareas listas a los workers (Celery). HTTP /healthz :8002.
  # ---------------------------------------------------------------------------
  orchestrator:
    image: agentic-platform/orchestrator:manuals
    environment:
      ORCHESTRATOR_ENVIRONMENT: dev
      # API_SERVER_ENVIRONMENT: este contenedor NO es la api-server, pero SÍ
      # ejecuta código suyo (importa `api_server.*`), y ese código lee sus
      # Settings del entorno con prefijo `API_SERVER_`. Sin esta variable,
      # `api_server.config.get_settings().environment` cae a su default "dev"
      # DENTRO de este contenedor, aunque el despliegue sea de producción, y los
      # guards anti-defaults de la api-server (secretos de dev, suelo de longitud
      # HMAC, «los dos secretos difieren») no disparan aquí. Verificado el
      # 2026-07-30 en el contenedor vivo. Debe llevar el MISMO valor que
      # `<PREFIX>ENVIRONMENT` de este servicio.
      API_SERVER_ENVIRONMENT: dev
      ORCHESTRATOR_DATABASE_URL: postgresql+asyncpg://migrations_user:changeme-migrations-dev-only@postgres:5432/agentic_platform
      ORCHESTRATOR_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/0
      ORCHESTRATOR_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/1
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/healthz',timeout=5).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [agentic-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # worktrees-init — one-shot: el volumen se crea root:root, pero el worker corre
  # como UID 1000 y debe crear bare repos + worktrees en el data-root (prod-18).
  # chown al levantar el stack; el entrypoint del worker (docker-entrypoint.sh)
  # se auto-repara además en cada arranque (auditoría 2026-07-02) — este one-shot
  # queda como red de seguridad.
  # ---------------------------------------------------------------------------
  worktrees-init:
    image: busybox:1.36
    user: "0:0"
    command:
      [
        "sh",
        "-c",
        "mkdir -p /var/lib/docker/volumes/agentic-platform-agent-data/_data && chown -R 1000:1000 /var/lib/docker/volumes/agentic-platform-agent-data/_data",
      ]
    volumes:
      # DURABILIDAD (2026-07-03): el data-root de agentes ya NO es un bind al
      # rootfs de la VM de Docker Desktop (efímero — cada engine-restart lo
      # recreaba VACÍO; así se perdieron los bare repos el 2026-07-02). Ahora es
      # el named volume EXTERNO agentic-platform-agent-data (vive en el VHDX
      # persistente de docker-desktop-data, como postgres_data), montado EN SU
      # RUTA DAEMON-SIDE (/var/lib/docker/volumes/<vol>/_data) para conservar la
      # identidad de rutas que exige el bind DooD hacia los agent-runtime: el
      # daemon resuelve el bind-source en el FS del host, así que el path debe
      # ser el MISMO dentro del worker y en el host (ver gotcha
      # worktree-bind-dood-empty-vs-named-volume). Bootstrap una única vez:
      #   docker volume create agentic-platform-agent-data
      # `external: true` ⇒ ni siquiera `docker compose down -v` lo elimina.
      - agent_data:/var/lib/docker/volumes/agentic-platform-agent-data/_data
    networks: [agentic-net]
    restart: "no"

  # ---------------------------------------------------------------------------
  # workers — pool Celery que ejecuta tareas lanzando agent-runtime efímeros.
  # DOCKER_HOST → docker-socket-proxy; agent-runtime:v1 (default); JWT igual que
  # el api-server (token interno del agente). Tres redes (agentic-net + -agents
  # + -docker).
  # ---------------------------------------------------------------------------
  workers:
    image: agentic-platform/workers:ci
    command:
      [
        "celery",
        "-A",
        "workers.celery_app",
        "worker",
        "--queues=default,ingestion,test,review",
        "--concurrency=2",
        "--loglevel=info",
      ]
    environment:
      WORKERS_ENVIRONMENT: dev
      # API_SERVER_ENVIRONMENT: este contenedor NO es la api-server, pero SÍ
      # ejecuta código suyo (importa `api_server.*`), y ese código lee sus
      # Settings del entorno con prefijo `API_SERVER_`. Sin esta variable,
      # `api_server.config.get_settings().environment` cae a su default "dev"
      # DENTRO de este contenedor, aunque el despliegue sea de producción, y los
      # guards anti-defaults de la api-server (secretos de dev, suelo de longitud
      # HMAC, «los dos secretos difieren») no disparan aquí. Verificado el
      # 2026-07-30 en el contenedor vivo. Debe llevar el MISMO valor que
      # `<PREFIX>ENVIRONMENT` de este servicio.
      API_SERVER_ENVIRONMENT: dev
      WORKERS_DATABASE_URL: postgresql+asyncpg://migrations_user:changeme-migrations-dev-only@postgres:5432/agentic_platform
      WORKERS_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/1
      WORKERS_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/2
      WORKERS_EVENTS_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/0 # MUST match ORCHESTRATOR_REDIS_URL / API_SERVER_REDIS_URL (events:tasks stream); /3 has no consumer so dispatch stalls
      WORKERS_JWT_SECRET: dev-only-jwt-secret-change-me
      WORKERS_AGENT_INTERNAL_API_URL: http://api-server:8000
      WORKERS_AGENT_RUNTIME_IMAGE: agent-runtime:v1
      # ADR 0080: el navegador sandboxeado del córtex (imagen construida aparte,
      # como agent-runtime); el worker lo lanza efímero por sesión aprobada.
      WORKERS_BROWSER_RUNTIME_IMAGE: browser-runtime:v1
      WORKERS_DATA_ROOT: /var/lib/docker/volumes/agentic-platform-agent-data/_data
      WORKERS_EGRESS_PROXY_URL: http://egress-proxy:8888
      # task_wf_55: los perfiles ENDURECIDOS que el worker pina sobre los
      # sandboxes que lanza. Existían en disco (y el instalador ya los pinaba en
      # el compose que genera) pero el stack de dev corría con los perfiles por
      # DEFECTO de Docker — o sea, el entorno donde se prueba todo era el menos
      # protegido de los dos. El JSON viene del bind de ./seccomp de abajo.
      #
      # Sobrescribibles desde el .env: si un toolchain choca con el perfil
      # estricto, `WORKERS_SECCOMP_PROFILE_PATH=` en el .env lo desactiva sin
      # tocar el compose.
      WORKERS_SECCOMP_PROFILE_PATH: ${WORKERS_SECCOMP_PROFILE_PATH-/etc/agentic/seccomp/agent-runtime.json}
      # AppArmor queda VACÍO por defecto a propósito: pinar un perfil que el
      # host no tiene cargado hace fallar la creación del contenedor, y el dev
      # típico es Docker Desktop sobre WSL2, que no trae AppArmor. En un host
      # Linux con el perfil cargado (`apparmor_parser docker/apparmor/
      # agent-runtime.profile`) se activa con WORKERS_APPARMOR_PROFILE=agent-runtime.
      WORKERS_APPARMOR_PROFILE: ${WORKERS_APPARMOR_PROFILE-}
      # ADR 0072: el worker resuelve la credencial git del proyecto desde Vault
      # (mismo Vault dev que el api-server) al clonar/fetch repos privados.
      WORKERS_VAULT_URL: http://vault:8200
      WORKERS_VAULT_TOKEN: ${API_SERVER_VAULT_TOKEN:-dev-root-token}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # La ingesta de KB (workers.ingestion) reutiliza las dependencias de
      # api_server (storage MinIO, docling-serve, ClamAV, embedder Ollama):
      # cada factory "lee sus propios Settings de api-server del env"
      # (ingestion.py), o sea settings con prefijo API_SERVER_*. Sin estas,
      # caen a sus defaults `localhost:*` y fallan dentro del contenedor
      # ("connection refused"). Mismos endpoints/credenciales dev que el
      # servicio api-server.
      API_SERVER_MINIO_URL: http://minio:9000
      API_SERVER_MINIO_ACCESS_KEY: minioadmin
      API_SERVER_MINIO_SECRET_KEY: changeme-dev-only
      API_SERVER_DOCLING_SERVE_URL: http://docling-serve:5001
      API_SERVER_OLLAMA_URL: http://ollama:11434
      API_SERVER_CLAMAV_HOST: clamav
      API_SERVER_CLAMAV_PORT: "3310"
      # Worker-NATIVE Ollama wiring (distinct from the API_SERVER_* ingestion
      # factories above). The memory-embedding backfill, the Memorizer and the
      # córtex affect distiller read the worker's OWN settings, which default to
      # localhost:11434 and so fail inside the container ("All connection attempts
      # failed"). Point them at the in-stack ollama. The embedder model
      # (nomic-embed-text) matches what's pulled; the chat distillers use the
      # small model pulled in this stack (llama3.2:1b) vs the llama3.1 code default.
      WORKERS_MEMORY_EMBEDDER_BASE_URL: http://ollama:11434
      WORKERS_MEMORIZER_LLM_BASE_URL: http://ollama:11434/v1
      WORKERS_MEMORIZER_LLM_MODEL: llama3.2:1b
      WORKERS_CORTEX_AFFECT_LLM_BASE_URL: http://ollama:11434/v1
      WORKERS_CORTEX_AFFECT_LLM_MODEL: llama3.2:1b
    volumes:
      # Data-root DURABLE (2026-07-03): named volume EXTERNO montado en su ruta
      # daemon-side para que los binds DooD (worker → daemon → agent-runtime)
      # resuelvan el MISMO path dentro y fuera. Racional completo + bootstrap en
      # worktrees-init.
      - agent_data:/var/lib/docker/volumes/agentic-platform-agent-data/_data
      - ./seccomp:/etc/agentic/seccomp:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      docker-socket-proxy: { condition: service_started }
      # El volumen se crea root:root; el worker corre como UID 1000 y tendría
      # EACCES creando <data-root>/projects (provisión de worktrees). Gate
      # sobre el chown one-shot.
      worktrees-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A workers.celery_app inspect ping -d celery@$$HOSTNAME -t 5 || exit 1",
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    networks: [agentic-net, agentic-agents, agentic-docker]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # workers-aux — pool AUXILIAR de Celery (auditoría 2026-07-03, plan
  # guardas-research-por-novedad D1): consume test/review/privileged con pool
  # PROPIA. Sin él, el worker principal (default,ingestion,test,review,
  # concurrency=2) se auto-inanea: un agent-run bloqueado esperando el resultado
  # de stack_exec (cola test) ocupa el mismo slot que ese comando necesita — con
  # 2 runs en vuelo, la cola test no tiene consumidor y el agente muere por
  # ReadTimeout a los 300 s (run 019f252e). La cola `privileged` (backup diario,
  # Plan 12) tampoco tenía consumidor en dev (hallazgo F0.4). Mismo image/env
  # que workers.
  # ---------------------------------------------------------------------------
  workers-aux:
    image: agentic-platform/workers:ci
    command:
      [
        "celery",
        "-A",
        "workers.celery_app",
        "worker",
        "--queues=test,review",
        "--concurrency=2",
        "--loglevel=info",
      ]
    environment:
      WORKERS_ENVIRONMENT: dev
      # API_SERVER_ENVIRONMENT: este contenedor NO es la api-server, pero SÍ
      # ejecuta código suyo (importa `api_server.*`), y ese código lee sus
      # Settings del entorno con prefijo `API_SERVER_`. Sin esta variable,
      # `api_server.config.get_settings().environment` cae a su default "dev"
      # DENTRO de este contenedor, aunque el despliegue sea de producción, y los
      # guards anti-defaults de la api-server (secretos de dev, suelo de longitud
      # HMAC, «los dos secretos difieren») no disparan aquí. Verificado el
      # 2026-07-30 en el contenedor vivo. Debe llevar el MISMO valor que
      # `<PREFIX>ENVIRONMENT` de este servicio.
      API_SERVER_ENVIRONMENT: dev
      WORKERS_DATABASE_URL: postgresql+asyncpg://migrations_user:changeme-migrations-dev-only@postgres:5432/agentic_platform
      WORKERS_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/1
      WORKERS_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/2
      WORKERS_EVENTS_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/0
      WORKERS_JWT_SECRET: dev-only-jwt-secret-change-me
      WORKERS_AGENT_INTERNAL_API_URL: http://api-server:8000
      WORKERS_AGENT_RUNTIME_IMAGE: agent-runtime:v1
      # ADR 0080: el navegador sandboxeado del córtex (imagen construida aparte,
      # como agent-runtime); el worker lo lanza efímero por sesión aprobada.
      WORKERS_BROWSER_RUNTIME_IMAGE: browser-runtime:v1
      WORKERS_DATA_ROOT: /var/lib/docker/volumes/agentic-platform-agent-data/_data
      WORKERS_EGRESS_PROXY_URL: http://egress-proxy:8888
      # task_wf_55: los perfiles ENDURECIDOS que el worker pina sobre los
      # sandboxes que lanza. Existían en disco (y el instalador ya los pinaba en
      # el compose que genera) pero el stack de dev corría con los perfiles por
      # DEFECTO de Docker — o sea, el entorno donde se prueba todo era el menos
      # protegido de los dos. El JSON viene del bind de ./seccomp de abajo.
      #
      # Sobrescribibles desde el .env: si un toolchain choca con el perfil
      # estricto, `WORKERS_SECCOMP_PROFILE_PATH=` en el .env lo desactiva sin
      # tocar el compose.
      WORKERS_SECCOMP_PROFILE_PATH: ${WORKERS_SECCOMP_PROFILE_PATH-/etc/agentic/seccomp/agent-runtime.json}
      # AppArmor queda VACÍO por defecto a propósito: pinar un perfil que el
      # host no tiene cargado hace fallar la creación del contenedor, y el dev
      # típico es Docker Desktop sobre WSL2, que no trae AppArmor. En un host
      # Linux con el perfil cargado (`apparmor_parser docker/apparmor/
      # agent-runtime.profile`) se activa con WORKERS_APPARMOR_PROFILE=agent-runtime.
      WORKERS_APPARMOR_PROFILE: ${WORKERS_APPARMOR_PROFILE-}
      WORKERS_VAULT_URL: http://vault:8200
      WORKERS_VAULT_TOKEN: ${API_SERVER_VAULT_TOKEN:-dev-root-token}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      API_SERVER_MINIO_URL: http://minio:9000
      API_SERVER_MINIO_ACCESS_KEY: minioadmin
      API_SERVER_MINIO_SECRET_KEY: changeme-dev-only
      API_SERVER_DOCLING_SERVE_URL: http://docling-serve:5001
      API_SERVER_OLLAMA_URL: http://ollama:11434
      API_SERVER_CLAMAV_HOST: clamav
      API_SERVER_CLAMAV_PORT: "3310"
      WORKERS_MEMORY_EMBEDDER_BASE_URL: http://ollama:11434
      WORKERS_MEMORIZER_LLM_BASE_URL: http://ollama:11434/v1
      WORKERS_MEMORIZER_LLM_MODEL: llama3.2:1b
      WORKERS_CORTEX_AFFECT_LLM_BASE_URL: http://ollama:11434/v1
      WORKERS_CORTEX_AFFECT_LLM_MODEL: llama3.2:1b
    volumes:
      # Mismo data-root durable que `workers` (ver worktrees-init).
      - agent_data:/var/lib/docker/volumes/agentic-platform-agent-data/_data
      - ./seccomp:/etc/agentic/seccomp:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      docker-socket-proxy: { condition: service_started }
      worktrees-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A workers.celery_app inspect ping -d celery@$$HOSTNAME -t 5 || exit 1",
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    networks: [agentic-net, agentic-agents, agentic-docker]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # workers-backup — pool DEDICADO de la cola `privileged` (backup diario Plan 12
  # + restores). Corre como ROOT dentro de su contenedor (WORKERS_RUN_AS_ROOT):
  # el paso volume-tar lee los _data de redis (uid 999) y vault (uid 100), ambos
  # 0700 — ilegibles para uid 1000 — y un restore además ESCRIBE en ellos. Este
  # pool NO ejecuta runs de agentes (solo privileged), así que el resto de
  # workers siguen degradando a uid 1000. Montajes: /var/lib/docker/volumes RW
  # (tar en backup, extract en restore) y /backups → bind al host WINDOWS
  # (repo/.backups/), fuera del VHDX de Docker: los bundles sobreviven incluso
  # a perder Docker Desktop entero.
  # ---------------------------------------------------------------------------
  workers-backup:
    image: agentic-platform/workers:ci
    command:
      [
        "celery",
        "-A",
        "workers.celery_app",
        "worker",
        "--queues=privileged",
        "--concurrency=1",
        "--loglevel=info",
      ]
    environment:
      WORKERS_ENVIRONMENT: dev
      # API_SERVER_ENVIRONMENT: este contenedor NO es la api-server, pero SÍ
      # ejecuta código suyo (importa `api_server.*`), y ese código lee sus
      # Settings del entorno con prefijo `API_SERVER_`. Sin esta variable,
      # `api_server.config.get_settings().environment` cae a su default "dev"
      # DENTRO de este contenedor, aunque el despliegue sea de producción, y los
      # guards anti-defaults de la api-server (secretos de dev, suelo de longitud
      # HMAC, «los dos secretos difieren») no disparan aquí. Verificado el
      # 2026-07-30 en el contenedor vivo. Debe llevar el MISMO valor que
      # `<PREFIX>ENVIRONMENT` de este servicio.
      API_SERVER_ENVIRONMENT: dev
      WORKERS_DATABASE_URL: postgresql+asyncpg://migrations_user:changeme-migrations-dev-only@postgres:5432/agentic_platform
      WORKERS_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/1
      WORKERS_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/2
      WORKERS_EVENTS_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/0
      WORKERS_JWT_SECRET: dev-only-jwt-secret-change-me
      WORKERS_DATA_ROOT: /var/lib/docker/volumes/agentic-platform-agent-data/_data
      WORKERS_RUN_AS_ROOT: "1"
      # workers.rotate_credentials (cola privileged, Plan 15) toca Vault.
      WORKERS_VAULT_URL: http://vault:8200
      WORKERS_VAULT_TOKEN: ${API_SERVER_VAULT_TOKEN:-dev-root-token}
      # Backup (F0.4 + durabilidad 2026-07-03): los volúmenes de infra llevan el
      # prefijo real del proyecto compose (agentic-platform_*) — los defaults del
      # código («minio_data», …) no existen en este stack — y el data-root de
      # agentes entra como CUARTO volumen (ya no es un bind, así que
      # WORKERS_BACKUP_BIND_PATHS queda vacío).
      WORKERS_BACKUP_ROOT: /backups
      WORKERS_BACKUP_VOLUMES: '["agentic-platform_minio_data","agentic-platform_redis_data","agentic-platform_vault_data","agentic-platform-agent-data"]'
      WORKERS_BACKUP_BIND_PATHS: "[]"
      # pg_dump corre DENTRO del contenedor → URL libpq al postgres del stack
      # (el default del código apunta a localhost:15432, el puerto publicado en
      # el host, inalcanzable desde aquí).
      WORKERS_BACKUP_DATABASE_URL: postgresql://migrations_user:changeme-migrations-dev-only@postgres:5432/agentic_platform
      # La métrica de salud del backup (BackupLastRunFailed/BackupTooOld) va al
      # textfile collector de node-exporter — su volumen ya es visible bajo el
      # mount de /var/lib/docker/volumes (el default /host/textfile no existe
      # en este contenedor y la métrica moría en un path local invisible).
      WORKERS_BACKUP_METRICS_TEXTFILE_PATH: /var/lib/docker/volumes/agentic-platform_node_exporter_textfile/_data/agentic_backup.prom
    volumes:
      # Paso volume-tar (backup) + extract (restore) sobre <root>/<vol>/_data.
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      # Destino de los bundles (WORKERS_BACKUP_ROOT) — host Windows.
      - ../.backups/agent-platform:/backups
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A workers.celery_app inspect ping -d celery@$$HOSTNAME -t 5 || exit 1",
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    networks: [agentic-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # cortex-beat — Celery beat: agenda los bucles de fondo del córtex (F4):
  # reflexión / curiosidad / mantenimiento (beat_schedule en workers.celery_app).
  # SOLO encola por horario; el trabajo lo hace el pool `workers`. Tickea siempre,
  # pero con el kill-switch `cortex.autonomy_enabled` OFF (default) las tareas salen
  # no-op → seguro tenerlo levantado. Activar F4 = encender el switch (UI owner).
  # ---------------------------------------------------------------------------
  cortex-beat:
    image: agentic-platform/workers:ci
    command: ["celery", "-A", "workers.celery_app", "beat", "--loglevel=info"]
    environment:
      WORKERS_ENVIRONMENT: dev
      # API_SERVER_ENVIRONMENT: este contenedor NO es la api-server, pero SÍ
      # ejecuta código suyo (importa `api_server.*`), y ese código lee sus
      # Settings del entorno con prefijo `API_SERVER_`. Sin esta variable,
      # `api_server.config.get_settings().environment` cae a su default "dev"
      # DENTRO de este contenedor, aunque el despliegue sea de producción, y los
      # guards anti-defaults de la api-server (secretos de dev, suelo de longitud
      # HMAC, «los dos secretos difieren») no disparan aquí. Verificado el
      # 2026-07-30 en el contenedor vivo. Debe llevar el MISMO valor que
      # `<PREFIX>ENVIRONMENT` de este servicio.
      API_SERVER_ENVIRONMENT: dev
      WORKERS_DATABASE_URL: postgresql+asyncpg://migrations_user:changeme-migrations-dev-only@postgres:5432/agentic_platform
      WORKERS_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/1
      WORKERS_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/2
      WORKERS_EVENTS_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/0 # MUST match ORCHESTRATOR_REDIS_URL / API_SERVER_REDIS_URL (events:tasks stream); /3 has no consumer so dispatch stalls
      WORKERS_JWT_SECRET: dev-only-jwt-secret-change-me
    depends_on:
      redis: { condition: service_healthy }
    # beat es un SCHEDULER sin endpoint HTTP: el healthcheck HTTP que la imagen
    # workers:ci hereda del api-server (FROM api-server) NUNCA pasa para beat.
    # `celery inspect ping` tampoco aplica (beat no es un worker que responda a
    # inspect). Verificamos que el proceso beat es el PID 1 vivo del contenedor
    # (si beat muere, PID 1 muere y el contenedor reinicia). Python puro, sin
    # herramientas extra en la imagen slim.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys; sys.exit(0 if b'beat' in open('/proc/1/cmdline', 'rb').read() else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [agentic-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # vault — PERSISTENTE (Camino B): deshace el `-dev` de docker-compose.dev.yml
  # y usa el backend de FICHERO del base (config.hcl sobre el volumen vault_data),
  # así los secretos SOBREVIVEN a reinicios. El `vault-unsealer` de abajo lo
  # inicializa/des-sella solo. (El env VAULT_DEV_* del overlay dev es inocuo en
  # modo server; solo el `command` decide el modo.)
  # ---------------------------------------------------------------------------
  vault:
    command: ["server"]
    # No tocamos `volumes` (el merge con el `!reset` de dev.yml es problemático y
    # tira el bind-mount). En su lugar inyectamos la config de servidor (backend de
    # FICHERO sobre el volumen vault_data) por VAULT_LOCAL_CONFIG: el entrypoint del
    # contenedor la escribe en /vault/config/ y `vault server` la carga. Equivale a
    # docker/vault/config.hcl pero sin pelearse con el override de volúmenes.
    environment:
      VAULT_LOCAL_CONFIG: >-
        {"storage":{"file":{"path":"/vault/file"}},
        "listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},
        "api_addr":"http://0.0.0.0:8200","cluster_addr":"http://0.0.0.0:8201",
        "ui":true,"disable_mlock":false}

  # ---------------------------------------------------------------------------
  # vault-unsealer — compañero que auto-inicializa + des-sella Vault en cada
  # arranque (sobrevive reinicios sin pasos manuales) y crea un token FIJO con el
  # id que las apps ya usan (dev-root-token), para no tocar su env. Usa solo el
  # CLI de vault contra http://vault:8200 (no arranca servidor). Las unseal keys
  # viven en el volumen vault_init (trade-off dev consciente — ver gotcha).
  # ---------------------------------------------------------------------------
  vault-unsealer:
    image: hashicorp/vault:1.17
    entrypoint: ["sh", "/vault/auto-unseal.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_FIXED_TOKEN: ${API_SERVER_VAULT_TOKEN:-dev-root-token}
    volumes:
      - ./vault/auto-unseal.sh:/vault/auto-unseal.sh:ro
      - vault_init:/vault/init
    depends_on:
      vault: { condition: service_started }
    networks: [agentic-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # notification-dispatcher — el consumidor de las colas notifications.* (M-1,
  # auditoría 2026-07-10). Sin él, TODO evento del dispatcher (plan_blocked /
  # plan_unblocked, review_escalated, budget_alert, human_validation_needed…)
  # se encolaba en dev sin que nadie lo convirtiera en notificación (in-app
  # incluidas): los workers dev solo consumen default/test/review/ingestion/
  # privileged. Espejo dev del servicio que el installer genera en prod
  # (compose_generator._notification_dispatcher_service): mismo broker /1 que
  # publica el api-server y misma DB con el usuario de plataforma. Imagen en
  # capas sobre la base api-server (mismo patrón BASE_IMAGE que workers):
  #   docker build -f apps/notification-dispatcher/Dockerfile \
  #     --build-arg BASE_IMAGE=agentic-platform/api-server:manuals \
  #     -t agentic-platform/notification-dispatcher:manuals .
  # ---------------------------------------------------------------------------
  notification-dispatcher:
    image: agentic-platform/notification-dispatcher:manuals
    environment:
      NOTIFY_ENVIRONMENT: dev
      # API_SERVER_ENVIRONMENT: este contenedor NO es la api-server, pero SÍ
      # ejecuta código suyo (importa `api_server.*`), y ese código lee sus
      # Settings del entorno con prefijo `API_SERVER_`. Sin esta variable,
      # `api_server.config.get_settings().environment` cae a su default "dev"
      # DENTRO de este contenedor, aunque el despliegue sea de producción, y los
      # guards anti-defaults de la api-server (secretos de dev, suelo de longitud
      # HMAC, «los dos secretos difieren») no disparan aquí. Verificado el
      # 2026-07-30 en el contenedor vivo. Debe llevar el MISMO valor que
      # `<PREFIX>ENVIRONMENT` de este servicio.
      API_SERVER_ENVIRONMENT: dev
      NOTIFY_DATABASE_URL: postgresql+asyncpg://migrations_user:changeme-migrations-dev-only@postgres:5432/agentic_platform
      NOTIFY_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/1
      NOTIFY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/2
      NOTIFY_EVENTS_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}@redis:6379/0
    healthcheck:
      # -A = el módulo real de la app (el del CMD del Dockerfile); `-d
      # celery@$$HOSTNAME` pinga ESTE nodo (el broker /1 es compartido con los
      # workers y un ping sin destino contestaría cualquiera).
      test:
        [
          "CMD-SHELL",
          "celery -A notification_dispatcher.celery_app:app inspect ping -d celery@$$HOSTNAME -t 5 || exit 1",
        ]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 40s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [agentic-net]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Sidecar WhatsApp neonize/whatsmeow (ADR 0109) — OPCIONAL, apagado por
  # defecto (profile). Arranque:
  #   docker compose ... --profile neonize up -d whatsapp-neonize
  # Primera vez: emparejar con QR (docker logs -f whatsapp-neonize) — runbook
  # docs/06-runbooks/whatsapp-neonize-pairing.md. Build:
  #   docker build -t agentic-platform/whatsapp-neonize:dev docker/whatsapp-neonize
  # El canal whatsapp del tenant usa provider "neonize" + secreto = NEONIZE_TOKEN.
  # ---------------------------------------------------------------------------
  whatsapp-neonize:
    image: agentic-platform/whatsapp-neonize:dev
    profiles: [neonize]
    environment:
      NEONIZE_TOKEN: dev-neonize-token
      NEONIZE_SESSION_DB: /data/session.sqlite3
    volumes:
      - whatsapp_neonize_session:/data
    networks: [agentic-net]
    restart: unless-stopped

volumes:
  # Sesión whatsmeow del sidecar neonize (ADR 0109): borrarla obliga a
  # re-emparejar por QR.
  whatsapp_neonize_session:
    name: agentic_whatsapp_neonize_session
  # Unseal keys + root token del Vault persistente (Camino B). Volumen docker,
  # NO en el repo. Borrarlo obliga a re-inicializar Vault (perderías los secretos).
  vault_init:
    name: agentic_vault_init
  # Data-root de agentes: bare repos + worktrees + dep-cache (durabilidad
  # 2026-07-03). EXTERNO — bootstrap una única vez con
  #   docker volume create agentic-platform-agent-data
  # — y DURABLE: sobrevive engine-restarts de Docker Desktop (vive en el VHDX
  # persistente, como postgres_data) Y a `docker compose down -v` (external
  # nunca se elimina). Se monta en su ruta daemon-side; racional en
  # worktrees-init.
  agent_data:
    name: agentic-platform-agent-data
    external: true

networks:
  # Red interna dedicada SOLO al tráfico workers ↔ docker-socket-proxy (ADR 0060).
  # En el compose generado de prod vive en docker-compose.yml; aquí (dev) la
  # declara el overlay de manuales.
  agentic-docker:
    name: agentic-docker
    driver: bridge
    internal: true
