# Alertas de APLICACIÓN (prod-08 núcleo, 2026-07-12) — consumen las métricas
# que los workers ya publican vía el textfile collector de node-exporter
# (workers/queue_metrics.py + backup_metrics.py). Fluyen por Alertmanager →
# POST /internal/alerts/ingest (NOTIF-2) → notificación al System Admin.
groups:
  - name: agentic-app
    rules:
      # prod-08 Fase B: LA alerta que faltaba. `up` la sintetiza Prometheus en
      # cada scrape (1 = el target respondió, 0 = no). Hasta 2026-07-31 no
      # había ninguna regla sobre ella, así que un servicio caído —incluido el
      # api-server— no disparaba absolutamente nada: todas las demás alertas de
      # este fichero se apoyan en métricas que un servicio muerto deja de
      # emitir, y una métrica AUSENTE no dispara ninguna regla. «No data» y
      # «todo bien» eran indistinguibles.
      #
      # `critical` a propósito: es la clase que alertmanager.yml enruta también
      # al receiver de respaldo email/Slack. Si el caído es el api-server, la
      # notificación por la plataforma no puede entregarse a sí misma.
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "El target {{ $labels.job }} ({{ $labels.instance }}) no responde"
          description: >-
            Prometheus lleva 2 minutos sin poder scrapear {{ $labels.instance }}
            del job {{ $labels.job }}. Si es api-server, la plataforma está
            caída para los usuarios. Si es node-exporter, se han ido con él
            TODAS las métricas de aplicación (viajan por su textfile
            collector). Comprueba `docker compose ps` y los logs del servicio.

      # Una cola Celery creciendo = ningún worker la drena (worker caído,
      # cola sin consumidor — el caso notifications.* muerto en dev de
      # 2026-07-10) o backlog fuera de control.
      - alert: CeleryQueueGrowing
        expr: agentic_celery_queue_depth > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Cola Celery {{ $labels.queue }} con backlog sostenido"
          description: >-
            La cola {{ $labels.queue }} lleva 15 minutos con más de 50 mensajes
            ({{ $value }}). Comprueba que su worker está vivo y consumiendo.

      # Un mensaje en la DLQ es trabajo PERDIDO (notificación no entregada tras
      # agotar reintentos) hasta que un humano lo revisa.
      - alert: NotificationsDLQNotEmpty
        expr: agentic_dlq_depth > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Dead-letter {{ $labels.stream }} con {{ $value }} entrada(s)"
          description: >-
            El stream {{ $labels.stream }} tiene entradas dead-lettered desde
            hace 10 minutos: notificaciones que agotaron reintentos. Revisa el
            canal (credenciales/URL) y re-encola o descarta.

      # AUD16-09 (auditoría 2026-07-16): el sampler de métricas emite un
      # heartbeat en cada pasada (30s). Sin heartbeat fresco, TODO lo demás de
      # este fichero es información congelada — antes «No data» en un panel era
      # indistinguible de «sampler muerto».
      - alert: MetricsSamplerStale
        expr: (time() - agentic_sampler_last_run_timestamp_seconds) > 300
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "El sampler de métricas de la plataforma lleva >5m sin correr"
          description: >-
            agentic_sampler_last_run_timestamp_seconds tiene más de 5 minutos
            ({{ $value | humanizeDuration }}): beat o el worker de mantenimiento
            no están muestreando — las métricas agentic_* están congeladas.

      # AUD16-09: un colector concreto falló en la última pasada (up=0) — la
      # familia ausente ya no es muda (p.ej. executions_24h sin datos por DB
      # caída vs. legítimamente cero runs).
      - alert: MetricsCollectorDown
        expr: agentic_sampler_collector_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Colector de métricas {{ $labels.collector }} fallando"
          description: >-
            El colector {{ $labels.collector }} del sampler lleva 5 minutos
            reportando fallo (up=0). Revisa los logs del worker de
            mantenimiento (maintenance.sample_queue_metrics.error).

      # Muchas tareas bloqueadas sostenidas = el pipeline autónomo está parado
      # esperando humanos (o un bug de convergencia).
      - alert: TasksBlockedHigh
        expr: agentic_tasks_by_status{status="blocked"} > 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} tareas bloqueadas desde hace 30 minutos"
          description: >-
            Hay más de 10 tareas en estado blocked de forma sostenida. Revisa
            el inbox humano y el visor de runs: o hay decisiones pendientes o
            el pipeline no converge.

      # prod-10 task_prod10_09 (hallazgos secrets-5 / deploy-8). Tras un reinicio
      # del host, un Vault con backend de fichero arranca SELLADO: vivo,
      # respondiendo HTTP, y sin poder descifrar un solo secreto. El healthcheck
      # del compose lo mapea a 200 A PROPÓSITO (si fuese unhealthy, Vault se
      # reiniciaría en bucle antes de que nadie pueda desellarlo), así que sin
      # esta regla no queda NINGUNA señal: las apps arrancan detrás de un
      # `service_healthy` mentiroso y fallan una a una al primer secreto.
      #
      # La serie la publica el api-server desde su sonda de
      # `/v1/sys/seal-status` (api_server.vault_client.probe_vault_seal), no el
      # exporter de Vault: las métricas de un Vault sellado son justo las que no
      # se pueden leer.
      #
      # `for: 2m` y no 0: un `docker restart vault` planificado tarda segundos en
      # desellarse con el compañero de auto-unseal del stack de dev, y una alerta
      # que grita en cada reinicio se silencia y deja de servir.
      - alert: VaultSealed
        expr: agentic_vault_sealed == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Vault está SELLADO: ningún secreto se puede resolver"
          description: >-
            Vault lleva 2 minutos sellado o sin inicializar. Las credenciales de
            proveedor LLM, los auth_ref de MCP y todo lo que viva en el KV son
            inaccesibles, y los servicios que arrancaron detrás de su healthcheck
            fallarán al primer secreto. Desellar es el PRIMER paso post-reinicio:
            docs/06-runbooks/restart-services.md.

      # Complemento de la anterior: el token con el que el api-server habla con
      # Vault caduca. Sin renovación era una avería programada a ~32 días vista
      # (hallazgo secrets-4); con `renew_self` en marcha, esta alerta es la que
      # avisa de que la renovación dejó de funcionar — 24 h de margen para
      # arreglarlo antes de que se caigan las credenciales LLM.
      - alert: VaultTokenExpiringSoon
        expr: agentic_vault_token_ttl_seconds > 0 and agentic_vault_token_ttl_seconds < 86400
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Al token de Vault le quedan menos de 24 h"
          description: >-
            El TTL del token de Vault del api-server ha bajado de 24 horas, así
            que la renovación automática (renew_self) no está funcionando. Busca
            `vault.token.renew_failed` en los logs y rota el token de servicio
            con scripts/vault-mint-service-tokens.sh antes de que caduque.
