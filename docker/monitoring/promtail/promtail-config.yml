# Promtail — envía a Loki los json-logs de TODOS los contenedores del host
# (Docker Desktop/daemon json-file). v1: etiqueta por container id (path) y
# extrae el nivel del JSON del driver; el nombre legible del contenedor
# llega en la línea (los servicios structlog ya emiten su propio contexto).
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-json-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
      - labels:
          stream:
      - output:
          source: output
