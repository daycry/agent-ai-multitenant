# Production-shaped stack for the agentic platform.
#
# Brings up the five infrastructure services described in plan 00:
# PostgreSQL (with pgvector), Redis, MinIO, Vault, ClamAV. All ports
# are kept inside the compose network — expose them via
# docker-compose.dev.yml for local development.
#
# Named volumes are used so the stack is portable across Linux/Windows
# hosts. For production hardening (bind-mount to /data/agent-platform,
# TLS, secrets from Vault), see the installer rolled out in phase 15.

name: agentic-platform

x-restart: &default-restart
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector (vector store lives in the same DB).
  # pg_trgm is built-in and enabled by docker/postgres/init/*.sql (task_00_05).
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_platform}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Consumed by docker/postgres/init/02-roles.sh on first start.
      MIGRATIONS_USER_PASSWORD: ${MIGRATIONS_USER_PASSWORD:-changeme-migrations-dev-only}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-changeme-app-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentic_platform}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [agentic-net]
    <<: [*default-restart, *default-logging]

  # ---------------------------------------------------------------------------
  # Redis 7 — sessions (server-side), Celery broker, rate-limit counters.
  # Persists with AOF + periodic RDB snapshots.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60 1"
      - --maxmemory
      - ${REDIS_MAX_MEM:-512mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [agentic-net]
    <<: [*default-restart, *default-logging]

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage. The web console runs on 9001.
  # ---------------------------------------------------------------------------
  minio:
    # Pinned to a fixed RELEASE tag for reproducibility — matches the
    # postgres:16 / redis:7-alpine / vault:1.17 pinning strategy and
    # blocks an unexpected :latest pull from running a different (or
    # compromised) build (task_06_14_11 / container-isolation-3).
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-dev-only}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [agentic-net]
    <<: [*default-restart, *default-logging]

  # ---------------------------------------------------------------------------
  # HashiCorp Vault in server mode with file backend.
  # task_00_06 ships scripts/init-vault.sh that initializes Vault and
  # captures unseal keys + root token securely.
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
    volumes:
      - vault_data:/vault/file
      - vault_logs:/vault/logs
      - ./vault/config.hcl:/vault/config/config.hcl:ro
    # The entrypoint already appends `-config=/vault/config/`, so we only
    # pass `server` here — adding a second `-config=...` would bind the
    # same listener twice and the container loops with EADDRINUSE.
    command: ["server"]
    healthcheck:
      # 200 = unsealed+active, 429 = standby, 472 = recovery, 473 = perf
      # standby, 501 = not initialized, 503 = sealed. Anything other than
      # 5xx counts as alive. wget returns 0 only on 2xx, so map sealed
      # (503) to 200 via the query string.
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [agentic-net]
    <<: [*default-restart, *default-logging]

  # ---------------------------------------------------------------------------
  # ClamAV — antivirus scanning for user-uploaded files (RAG ingestion,
  # KB documents). Definitions update via freshclam inside the container.
  # First start downloads ~200MB of signatures (start_period 120s).
  # ---------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks: [agentic-net]
    <<: [*default-restart, *default-logging]

  # ---------------------------------------------------------------------------
  # docling-serve — IBM's open-source document parser (Plan 04 task_04_10).
  # Converts PDF / Office / HTML / Markdown / audio (Whisper-backed)
  # into structured chunks that the ingestion worker persists into
  # `chunks`. Self-contained Python service; no DB, no Redis.
  # ---------------------------------------------------------------------------
  docling-serve:
    # Pinned (no :latest) for reproducible builds + supply-chain hygiene
    # (container-isolation-4). Bump deliberately after verifying the
    # /v1/convert contract still matches the ingestion worker.
    image: ghcr.io/docling-project/docling-serve:v1.20.0
    environment:
      # Open API surface: parse + structured chunks. Whisper is
      # included; audio just routes through the same /v1/convert API
      # (task_04_12).
      DOCLING_SERVE_ENABLE_UI: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [agentic-net]
    <<: [*default-restart, *default-logging]

  # ---------------------------------------------------------------------------
  # docling-mcp — MCP-protocol surface of Docling (Plan 04 task_04_21).
  #
  # NO se levanta en el dev compose: el proyecto upstream NO publica una
  # imagen pública en GHCR (`ghcr.io/docling-project/docling-mcp:latest`
  # responde con `denied`, que GHCR usa también para paquetes inexistentes).
  # El proyecto se distribuye como paquete Python ejecutable con uvx:
  #   uvx --from docling-mcp docling-mcp-server --transport stdio
  #
  # Para el flujo dev / demos no hace falta:
  #   - Plan 04 + 04.5 tests integración usan StaticDoclingMCPClient (fake).
  #   - Los demos no ejercitan HttpDoclingMCPClient (leen chunks de la BD).
  # Cuando llegue una imagen oficial (o un Dockerfile artesano del proyecto),
  # se reactiva aquí. Ver docs/03-guides/gotchas/docling-mcp-no-public-image.md.
  # ---------------------------------------------------------------------------
  # docling-mcp:
  #   image: ghcr.io/docling-project/docling-mcp:latest
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 60s
  #   networks: [agentic-net]
  #   <<: [*default-restart, *default-logging]

  # ---------------------------------------------------------------------------
  # egress-proxy — tinyproxy con allowlist (ADR 0019 / task_02_35).
  # Conectado a DOS redes:
  #  - `agentic-net`  → puerta a internet.
  #  - `agentic-agents` (internal) → la única vía que el sandbox
  #    `agent-runtime` tiene para alcanzar a un proveedor LLM real.
  # Las credenciales LLM siguen entrando al contenedor por /run/secrets
  # (Fase B); el proxy sólo controla qué hosts pueden salir.
  # ---------------------------------------------------------------------------
  egress-proxy:
    build: ./egress-proxy
    container_name: agentic-egress-proxy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- --no-proxy http://127.0.0.1:8888/ 2>&1 | grep -q tinyproxy || true",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - agentic-net
      - agentic-agents
    <<: [*default-restart, *default-logging]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  vault_data:
  vault_logs:
  clamav_data:

networks:
  agentic-net:
    name: agentic-net
    driver: bridge
  # Red INTERNA por la que viven los contenedores agent-runtime — sin
  # salida directa a internet, sólo alcanzan al `egress-proxy` que
  # comparte esta red (ADR 0012 + ADR 0019 / task_02_35). ICC habilitado
  # para que el agente pueda hablar con el proxy; el aislamiento real
  # del sandbox vive en el perfil endurecido (cap-drop, read-only FS,
  # seccomp, etc.), no en la red.
  agentic-agents:
    name: agentic-agents
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
