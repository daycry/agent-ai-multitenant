# Production-shaped stack for the agentic platform.
#
# Brings up the five infrastructure services described in plan 00:
# PostgreSQL (with pgvector), Redis, MinIO, Vault, ClamAV. All ports
# are kept inside the compose network — expose them via
# docker-compose.dev.yml for local development.
#
# Named volumes are used so the stack is portable across Linux/Windows
# hosts. For production hardening (bind-mount to /data/agent-platform,
# TLS termination via the Caddy reverse proxy, secrets from Vault), see the
# installer-generated compose (apps/installer, ADR 0061).

name: agentic-platform

x-restart: &default-restart
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# Hardening baseline for the TRUSTED long-lived platform services (Plan 15
# task_15_15/16, revised). These are first-party / official images (postgres,
# redis, minio, vault, clamav, docling, api-server, workers, ...); their threat
# model (CLAUDE.md principle 2) does NOT call for a hand-rolled syscall
# allowlist — that is reserved for the UNTRUSTED agent/test/review runtimes.
# So the trusted services get:
#   * no-new-privileges:true — no setuid/file-cap privilege gain.
#   * Docker's DEFAULT seccomp profile (by NOT overriding it) — the battle-
#     tested ~350-syscall allowlist that denies the dangerous syscalls
#     (mount, ptrace, kexec, bpf, init_module, reboot, swapon, pivot_root,
#     keyctl, ...) while actually running these images. A hand-rolled
#     default-deny profile here SIGSEGV'd the Go services (vault/minio) and
#     broke postgres (signalfd/shmget) — net negative for trusted services.
#   * apparmor=agentic-default — host MAC confinement (loaded via
#     `apparmor_parser -r -W docker/apparmor/agentic-default.profile`; see
#     docs/06-runbooks/apparmor-profiles.md). On Linux hosts (incl. GitHub
#     Ubuntu runners) the profile MUST be loaded before `up`, or Docker
#     aborts with "AppArmor profile agentic-default not found"; it is only a
#     no-op where AppArmor is genuinely absent (e.g. Docker Desktop on WSL2).
#     CI loads it (ci.yml test-integration); docker-compose.ci.yml
#     (apparmor=unconfined) is the documented fallback if a runner's parser
#     rejects the profile.
# The UNTRUSTED agent/test runtime sandbox DOES use the STRICT default-deny
# docker/seccomp/agent-runtime.json + docker/apparmor/agent-runtime.profile,
# applied by the worker at launch (workers.isolation), where it matters most.
# Profiles validated in tests/security/test_seccomp_profiles.py +
# test_apparmor.py; kernel enforcement confirmed on Linux (see
# internal-pentest-methodology.md §5).
#
# WORKER ↔ API-SERVER SHARED JWT SECRET (Plan 04.5 / followup-worker-internal-token).
# The app services (api-server, workers, orchestrator) are not yet declared in
# this compose file (dev runs them locally; the production declarations land
# with the Plan 15 installer). When the `workers` service IS declared here, it
# MUST receive `API_SERVER_JWT_SECRET` with the SAME value the `api-server`
# service uses — never inline plaintext, source it from env/Vault. The worker
# mints a short-lived `AGENTIC_INTERNAL_TOKEN` (api_server.auth.internal_agent.
# mint_agent_token) for each agent task and injects it into the agent-runtime
# container; that token is signed with the api-server's `jwt_secret`, so the
# api-server's `/internal/agent/*` endpoints only validate it when both sides
# share the secret. The internal URL the runtime calls back on is the
# operator-tunable `WORKERS_AGENT_INTERNAL_API_URL` (default
# `http://api-server:8000`, this compose's service hostname).
x-seccomp: &default-seccomp
  security_opt:
    - no-new-privileges:true
    - apparmor=agentic-default
  # cap_drop ALL is part of the hardening baseline (deploy-12 / prod-01 task_08):
  # mirrors compose_generator._hardening so the canonical + generated stacks
  # share ONE criterion. Vault adds IPC_LOCK back (cap_add, below) to mlock its
  # memory; the one-shot ollama-bootstrap merges only logging+seccomp.
  cap_drop: [ALL]

# Capabilities the official infra images need back on top of cap_drop:[ALL] to
# self-initialise: chown/chmod their data dir as root and drop to their service
# user via gosu/su-exec. Without them postgres/redis/clamav crash-loop on
# (re)start ("chmod/chown: Operation not permitted", "Permission denied").
# prod-01: the cap_drop baseline (task_08) was too broad for stateful official
# images — these add back ONLY the self-init caps, never the dangerous ones
# (NET_ADMIN, SYS_ADMIN, …). Vault needs SETFCAP too (it setcaps its binary).
x-infra-caps: &infra-caps [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

# Default resource cap (deploy-12 / prod-01 task_08): a CPU/memory limit so a
# runaway container cannot starve the single host. Services that legitimately
# need more (ollama models, docling) override `deploy` inline.
x-limits: &default-limits
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: "2g"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector (vector store lives in the same DB).
  # pg_trgm is built-in and enabled by docker/postgres/init/*.sql (task_00_05).
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_platform}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Consumed by docker/postgres/init/02-roles.sh on first start.
      MIGRATIONS_USER_PASSWORD: ${MIGRATIONS_USER_PASSWORD:-changeme-migrations-dev-only}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-changeme-app-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentic_platform}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [agentic-net]
    <<: [*default-restart, *default-logging, *default-seccomp, *default-limits]
    # Official postgres entrypoint self-inits PGDATA as root + drops to the
    # postgres user (see x-infra-caps).
    cap_add: *infra-caps

  # ---------------------------------------------------------------------------
  # Redis 7 — sessions (server-side), Celery broker, rate-limit counters.
  # Persists with AOF + periodic RDB snapshots.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60 1"
      - --maxmemory
      - ${REDIS_MAX_MEM:-512mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [agentic-net]
    <<: [*default-restart, *default-logging, *default-seccomp, *default-limits]
    # redis:7-alpine chowns /data + drops to the redis user (see x-infra-caps).
    cap_add: *infra-caps

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage. The web console runs on 9001.
  # ---------------------------------------------------------------------------
  minio:
    # Pinned to a fixed RELEASE tag for reproducibility — matches the
    # postgres:16 / redis:7-alpine / vault:1.17 pinning strategy and
    # blocks an unexpected :latest pull from running a different (or
    # compromised) build (task_06_14_11 / container-isolation-3).
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-dev-only}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [agentic-net]
    <<: [*default-restart, *default-logging, *default-seccomp, *default-limits]

  # ---------------------------------------------------------------------------
  # HashiCorp Vault in server mode with file backend.
  # task_00_06 ships scripts/init-vault.sh that initializes Vault and
  # captures unseal keys + root token securely.
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    # IPC_LOCK to mlock its memory; SETFCAP because the entrypoint setcaps its
    # own binary; plus the self-init/user-drop caps (see x-infra-caps).
    cap_add: [IPC_LOCK, SETFCAP, CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
    volumes:
      - vault_data:/vault/file
      - vault_logs:/vault/logs
      - ./vault/config.hcl:/vault/config/config.hcl:ro
    # The entrypoint already appends `-config=/vault/config/`, so we only
    # pass `server` here — adding a second `-config=...` would bind the
    # same listener twice and the container loops with EADDRINUSE.
    command: ["server"]
    healthcheck:
      # 200 = unsealed+active, 429 = standby, 472 = recovery, 473 = perf
      # standby, 501 = not initialized, 503 = sealed. Anything other than
      # 5xx counts as alive. wget returns 0 only on 2xx, so map sealed
      # (503) to 200 via the query string.
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [agentic-net]
    <<: [*default-restart, *default-logging, *default-seccomp, *default-limits]

  # ---------------------------------------------------------------------------
  # ClamAV — antivirus scanning for user-uploaded files (RAG ingestion,
  # KB documents). Definitions update via freshclam inside the container.
  # First start downloads ~200MB of signatures (start_period 120s).
  # ---------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks: [agentic-net]
    <<: [*default-restart, *default-logging, *default-seccomp, *default-limits]
    # clamav chowns /var/lib/clamav + drops to the clamav user (see x-infra-caps).
    cap_add: *infra-caps

  # ---------------------------------------------------------------------------
  # docling-serve — IBM's open-source document parser (Plan 04 task_04_10).
  # Converts PDF / Office / HTML / Markdown / audio (Whisper-backed)
  # into structured chunks that the ingestion worker persists into
  # `chunks`. Self-contained Python service; no DB, no Redis.
  # ---------------------------------------------------------------------------
  docling-serve:
    # Pinned (no :latest) for reproducible builds + supply-chain hygiene
    # (container-isolation-4). Bump deliberately after verifying the
    # /v1/convert contract still matches the ingestion worker.
    image: ghcr.io/docling-project/docling-serve:v1.20.0
    environment:
      # Open API surface: parse + structured chunks. Whisper is
      # included; audio just routes through the same /v1/convert API
      # (task_04_12).
      DOCLING_SERVE_ENABLE_UI: "false"
    healthcheck:
      # GET (-O /dev/null), NOT --spider: docling's /health rejects the HEAD
      # request --spider sends, so the spider check fails and the container is
      # wrongly marked unhealthy even though the endpoint serves 200 on GET.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Override the default 2g cap: document parsing (PDF/Office/Whisper) is
    # memory-hungry.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4g"
    networks: [agentic-net]
    <<: [*default-restart, *default-logging, *default-seccomp, *default-limits]

  # ---------------------------------------------------------------------------
  # stt — Speech-to-Text para el modo voz del Asistente (ADR 0073, voz F1).
  # faster-whisper (CTranslate2) con API OpenAI-compatible
  # (POST /v1/audio/transcriptions). El modelo Whisper se descarga al primer
  # uso desde HuggingFace y se cachea en el volumen `whisper_models`. Servicio
  # INTERNO: sin puertos al host; el api-server lo alcanza en `stt:8000`.
  # NB: confirmar tag/envs contra la imagen upstream; usar el overlay GPU
  # (docker-compose.gpu.yml) para modelos grandes / baja latencia tipo Meet.
  # ---------------------------------------------------------------------------
  stt:
    # fedirz/faster-whisper-server usa tags rodantes latest-cpu / latest-cuda (no
    # semver). Para pin reproducible en prod, fijar por digest (@sha256:…).
    image: fedirz/faster-whisper-server:latest-cpu # latest-cuda en el overlay GPU
    environment:
      # Modelo CPU-friendly por defecto (ES+EN); `large-v3` vía GPU overlay.
      WHISPER__MODEL: Systran/faster-whisper-small
      WHISPER__INFERENCE_DEVICE: cpu
    volumes:
      - whisper_models:/root/.cache/huggingface
    healthcheck:
      # La imagen NO trae wget; sí python3. urlopen lanza (exit!=0) si /health no responde.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s # 1er arranque descarga el modelo
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4g"
    networks: [agentic-net]
    <<: [*default-restart, *default-logging, *default-seccomp, *default-limits]

  # ---------------------------------------------------------------------------
  # tts — Text-to-Speech para el modo voz (ADR 0073, voz F1). Kokoro-82M
  # (Apache-2.0) con API OpenAI-compatible (POST /v1/audio/speech); voces M/F
  # ES+EN incluidas. INTERNO: el api-server lo alcanza en `tts:8880`.
  # ---------------------------------------------------------------------------
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2 # pin; -gpu en el overlay GPU
    healthcheck:
      # La imagen NO trae wget; sí python (en /app/.venv). urlopen lanza si /health falla.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8880/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2g"
    networks: [agentic-net]
    <<: [*default-restart, *default-logging, *default-seccomp, *default-limits]

  # ---------------------------------------------------------------------------
  # docling-mcp — MCP-protocol surface of Docling (Plan 04 task_04_21).
  #
  # NO se levanta en el dev compose: el proyecto upstream NO publica una
  # imagen pública en GHCR (`ghcr.io/docling-project/docling-mcp:latest`
  # responde con `denied`, que GHCR usa también para paquetes inexistentes).
  # El proyecto se distribuye como paquete Python ejecutable con uvx:
  #   uvx --from docling-mcp docling-mcp-server --transport stdio
  #
  # Para el flujo dev / demos no hace falta:
  #   - Plan 04 + 04.5 tests integración usan StaticDoclingMCPClient (fake).
  #   - Los demos no ejercitan HttpDoclingMCPClient (leen chunks de la BD).
  # Cuando llegue una imagen oficial (o un Dockerfile artesano del proyecto),
  # se reactiva aquí. Ver docs/03-guides/gotchas/docling-mcp-no-public-image.md.
  # ---------------------------------------------------------------------------
  # docling-mcp:
  #   image: ghcr.io/docling-project/docling-mcp:latest
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 60s
  #   networks: [agentic-net]
  #   <<: [*default-restart, *default-logging]

  # ---------------------------------------------------------------------------
  # egress-proxy — tinyproxy con allowlist (ADR 0019 / task_02_35).
  # Conectado a DOS redes:
  #  - `agentic-net`  → puerta a internet.
  #  - `agentic-agents` (internal) → la única vía que el sandbox
  #    `agent-runtime` tiene para alcanzar a un proveedor LLM real.
  # Las credenciales LLM siguen entrando al contenedor por /run/secrets
  # (Fase B); el proxy sólo controla qué hosts pueden salir.
  # ---------------------------------------------------------------------------
  egress-proxy:
    build: ./egress-proxy
    container_name: agentic-egress-proxy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- --no-proxy http://127.0.0.1:8888/ 2>&1 | grep -q tinyproxy || true",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - agentic-net
      - agentic-agents
    <<: [*default-restart, *default-logging, *default-seccomp, *default-limits]
    # tinyproxy drops to the tinyproxy user/group on start (setgid/setuid),
    # so it needs the privilege-drop caps back (see x-infra-caps). Without them
    # it dies with "Unable to change to group 'tinyproxy'".
    cap_add: *infra-caps

  # ---------------------------------------------------------------------------
  # registry-proxy — tinyproxy con allowlist de registries de paquetes (ADR 0094).
  # SEGUNDA instancia, disjunta del egress-proxy LLM: el worker la conecta a los
  # bridges efímeros per-task de los runtime-templates para que resuelvan sus
  # registries (composer/pip/npm/go/nuget/maven/gradle/ruby/cargo + git hosts).
  # Vive SOLO en `agentic-net` (NUNCA en `agentic-agents`): el agent-runtime no
  # debe alcanzar github/pypi/etc. El runtime-template sigue en un bridge interno
  # (sin NAT crudo); este proxy es su única vía de salida, allowlisted.
  # ---------------------------------------------------------------------------
  registry-proxy:
    build: ./registry-proxy
    container_name: agentic-registry-proxy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- --no-proxy http://127.0.0.1:8888/ 2>&1 | grep -q tinyproxy || true",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - agentic-net
    <<: [*default-restart, *default-logging, *default-seccomp, *default-limits]
    # tinyproxy drops to the tinyproxy user/group on start (setgid/setuid),
    # so it needs the privilege-drop caps back (see x-infra-caps).
    cap_add: *infra-caps

  # ---------------------------------------------------------------------------
  # searxng — meta-buscador self-host para la web del córtex (ADR 0067). El
  # api-server lo alcanza en `searxng:8080` (API_SERVER_CORTEX_SEARXNG_URL) y le
  # pide `/search?q=&format=json`. Es el proveedor de búsqueda POR DEFECTO
  # (sin API key, coherente con el despliegue de una sola máquina); la
  # alternativa Brave (key en Vault/env) sale por el egress-proxy.
  #
  # SearXNG sólo sirve JSON cuando `search.formats` incluye `json` en su
  # settings.yml; el bind-mount monta esa config (docker/searxng/settings.yml).
  # Vive en `agentic-net` para poder consultar a los motores de búsqueda
  # upstream a través de su propia salida; NO escucha en el host (sin `ports`).
  # ---------------------------------------------------------------------------
  searxng:
    image: ${IMAGE_SEARXNG:-searxng/searxng:latest}
    environment:
      # Base URL pública del propio SearXNG (sólo afecta a enlaces que genera).
      SEARXNG_BASE_URL: http://searxng:8080/
      # Clave para firmar las URLs de imagen/respuesta; en dev un default, en
      # prod el instalador la inyecta desde Vault/env.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-changeme-searxng-dev-only}
    volumes:
      # Config con `search.formats: [html, json]` para que el córtex reciba JSON.
      - ./searxng:/etc/searxng:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [agentic-net]
    <<: [*default-restart, *default-logging, *default-seccomp, *default-limits]
    # SearXNG (uwsgi) drops privileges to its service user at start, so it needs
    # the privilege-drop caps back on top of cap_drop:[ALL] (see x-infra-caps).
    cap_add: *infra-caps

  # ---------------------------------------------------------------------------
  # Ollama — in-stack embeddings (and optionally local LLMs) for the platform
  # (ADR 0056). CPU by default; for GPU (CUDA) acceleration overlay
  # docker/docker-compose.gpu.yml (the installer wires the same NVIDIA
  # reservation when the operator picks mode `gpu`). The api-server embedder
  # hits this service at http://ollama:11434 (API_SERVER_OLLAMA_URL); in dev
  # the port is exposed to the host (docker-compose.dev.yml) so a host-run
  # api-server reaches it at localhost:11434. Lives on agentic-net so the
  # bootstrap can pull from the registry (ollama.com is egress-allowlisted).
  # ---------------------------------------------------------------------------
  ollama:
    image: ${IMAGE_OLLAMA:-ollama/ollama:0.31.1}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Override the default 2g cap: LLM/embedding models need more headroom.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: "8g"
    networks: [agentic-net]
    <<: [*default-restart, *default-logging, *default-seccomp, *default-limits]

  # ---------------------------------------------------------------------------
  # ollama-bootstrap — one-shot that pulls the embedding model into the ollama
  # volume once the server is healthy, then exits (ADR 0056 option B-A). Without
  # it the first /api/embed fails with `model not found`. Idempotent: a re-run
  # with the model already present is a fast no-op; the model persists in the
  # named volume. EMBEDDING_MODEL is the REAL registry name (default
  # nomic-embed-text), kept in lockstep with the api-server's embedding_model.
  # ---------------------------------------------------------------------------
  ollama-bootstrap:
    image: ${IMAGE_OLLAMA:-ollama/ollama:0.31.1}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull ${EMBEDDING_MODEL:-nomic-embed-text}"
    restart: "no"
    networks: [agentic-net]
    # One-shot bootstrap, but it still runs `ollama pull` over the network as a
    # long-ish process: carry the same trusted hardening baseline as every
    # other service (no-new-privileges + apparmor=agentic-default via the
    # x-seccomp anchor). It was added without it in the Ollama feature (ADR
    # 0056) — tests/security/test_{apparmor,seccomp_profiles}.py flag the gap.
    <<: [*default-logging, *default-seccomp]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  vault_data:
  vault_logs:
  clamav_data:
  ollama_data:
  whisper_models: # STT model cache (ADR 0073, voz F1)

networks:
  agentic-net:
    name: agentic-net
    driver: bridge
  # Red INTERNA por la que viven los contenedores agent-runtime — sin
  # salida directa a internet, sólo alcanzan al `egress-proxy` que
  # comparte esta red (ADR 0012 + ADR 0019 / task_02_35). ICC habilitado
  # para que el agente pueda hablar con el proxy; el aislamiento real
  # del sandbox vive en el perfil endurecido (cap-drop, read-only FS,
  # seccomp, etc.), no en la red.
  agentic-agents:
    name: agentic-agents
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
