[project]
name = "agent-runtime"
version = "1.0.0"
description = "Sandboxed agent loop runtime (LangGraph) for the agentic platform."
requires-python = ">=3.12"
dependencies = [
  # Agent-loop engine
  "langgraph>=0.2,<1.0",
  "langchain-core>=0.3,<1.0",

  # Builtin tools lean on these (Fase D)
  "httpx>=0.27,<1.0",

  # Validation / observability
  "pydantic>=2.5,<3.0",
  "structlog>=24.1,<26.0",
  "tenacity>=8.2,<10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime"]
