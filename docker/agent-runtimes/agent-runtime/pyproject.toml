[project]
name = "agent-runtime"
version = "1.0.0"
description = "Sandboxed agent loop runtime (LangGraph) for the agentic platform."
requires-python = ">=3.12"
dependencies = [
  # Agent-loop engine
  "langgraph>=1.2,<2",
  "langchain-core>=1.5,<2",

  # LLM provider layer (ADR 0021). The agent-runtime ModelClient
  # adapters in `providers.py` are thin wrappers over shared_llm.
  "shared-llm",

  # MCP client layer (Plan 05). The agent-runtime MCPToolRunner in
  # `mcp_tools.py` bridges the sync ToolRegistry to async MCP
  # sessions via a background asyncio loop.
  "shared-mcp",

  # Canonical tool-name source of truth (ADR 0048, Plan 06.18): the approval
  # gate keys its sensitive categories on canonical names and resolves legacy
  # aliases via shared_domain.tool_names.
  "shared-domain",

  # Guardrail engine (ADR 0102 / g1): the runtime scans tool outputs for prompt
  # injection (post_tool) before they re-enter the model context.
  "shared-guardrails",

  # Builtin tools lean on these (Fase D)
  "httpx>=0.27,<1.0",

  # Validation / observability
  "pydantic>=2.5,<3.0",
  "structlog>=24.1,<26.0",
  "tenacity>=8.2,<10.0",

  # JSON Schema validation of MCP tool arguments (task_06_14_12,
  # mcp-tools-1): args from the LLM are checked against each tool's
  # advertised input_schema before the call is dispatched.
  "jsonschema>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
]
# provider=claude only — the Claude Agent SDK. Optional so a deployment
# that uses Azure Foundry / Copilot / Ollama doesn't drag the SDK in.
claude = [
  "claude-agent-sdk>=0.2.82",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime"]
